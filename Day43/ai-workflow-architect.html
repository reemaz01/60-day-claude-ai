<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder's Validation Lab — Idea to MVP Workflow</title>
<style>
  :root{
    --void:#0A0F1C;
    --panel:#111B2E;
    --panel-raised:#16213A;
    --panel-raised2:#1C2A45;
    --border:#223049;
    --border-soft:#1A2740;
    --teal:#2DD4BF;
    --teal-dim:#1B8577;
    --amber:#F2A93B;
    --coral:#FF6B6B;
    --text:#E7ECF3;
    --muted:#8C9AB3;
    --muted2:#5E6C85;
    --font-display:'Avenir Next','Segoe UI Semibold','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Cascadia Code','Consolas',monospace;
    --radius:14px;
  }
  [data-theme="light"]{
    --void:#F3F5F9;
    --panel:#FFFFFF;
    --panel-raised:#F7F9FC;
    --panel-raised2:#EEF2F8;
    --border:#DDE4EE;
    --border-soft:#E7ECF3;
    --teal:#0F9C8A;
    --teal-dim:#0C7A6C;
    --amber:#B9750D;
    --coral:#D8434A;
    --text:#131A28;
    --muted:#5A6478;
    --muted2:#8C97AC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
    transition:background .35s ease,color .35s ease;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--teal); color:var(--void);}

  /* ---------- Scaffold ---------- */
  .app{display:grid; grid-template-columns:280px 1fr; min-height:100vh;}
  @media (max-width:980px){ .app{grid-template-columns:1fr;} }

  /* ---------- Header ---------- */
  header.topbar{
    grid-column:1/-1;
    display:flex; align-items:center; gap:20px;
    padding:16px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--teal),var(--teal-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; color:var(--void); font-size:14px;
    flex-shrink:0;
  }
  .brand-text .t1{font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:-.01em;}
  .brand-text .t2{font-size:11.5px; color:var(--muted); font-family:var(--font-mono);}

  .meter-wrap{display:flex; align-items:center; gap:12px; min-width:220px;}
  .meter-label{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap;}
  .meter{
    display:flex; gap:3px; align-items:flex-end; height:22px;
  }
  .meter i{
    width:6px; border-radius:1px; background:var(--border-soft); display:block;
    transition:background .25s ease, transform .25s ease;
  }
  .meter i:nth-child(1){height:40%;} .meter i:nth-child(2){height:55%;} .meter i:nth-child(3){height:70%;}
  .meter i:nth-child(4){height:85%;} .meter i:nth-child(5){height:100%;} .meter i:nth-child(6){height:85%;}
  .meter i:nth-child(7){height:70%;} .meter i:nth-child(8){height:55%;} .meter i:nth-child(9){height:40%;} .meter i:nth-child(10){height:25%;}
  .meter i.on{background:var(--teal);}
  .meter-pct{font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--teal); min-width:38px;}

  .topbar-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:var(--panel-raised); border:1px solid var(--border); color:var(--text);
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:15px; transition:border-color .2s, transform .15s;
  }
  .icon-btn:hover{border-color:var(--teal); transform:translateY(-1px);}
  .btn{
    background:var(--panel-raised); border:1px solid var(--border); color:var(--text);
    padding:9px 14px; border-radius:9px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px; transition:border-color .2s, transform .15s;
  }
  .btn:hover{border-color:var(--teal); transform:translateY(-1px);}
  .btn.primary{background:var(--teal); color:var(--void); border-color:var(--teal);}
  .btn.primary:hover{filter:brightness(1.08);}

  /* ---------- Sidebar rail ---------- */
  nav.rail{
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:20px 14px 40px;
    position:sticky; top:69px; align-self:start;
    height:calc(100vh - 69px); overflow-y:auto;
  }
  @media (max-width:980px){ nav.rail{position:relative; top:0; height:auto;} }
  .rail-heading{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--muted2); text-transform:uppercase; padding:6px 10px 12px;}
  .pipe{position:relative;}
  .stage-node{
    position:relative; display:flex; gap:12px; align-items:flex-start;
    padding:11px 10px; border-radius:10px; cursor:pointer;
    border:1px solid transparent;
    transition:background .18s, border-color .18s;
  }
  .stage-node:hover{background:var(--panel-raised);}
  .stage-node.active{background:var(--panel-raised2); border-color:var(--border);}
  .stage-node .connector{
    position:absolute; left:23px; top:34px; bottom:-14px; width:2px; background:var(--border-soft);
  }
  .stage-node:last-child .connector{display:none;}
  .node-dot{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; z-index:1;
    background:var(--panel-raised); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--muted);
    transition:all .2s;
  }
  .stage-node.done .node-dot{background:var(--teal); border-color:var(--teal); color:var(--void);}
  .stage-node.active .node-dot{border-color:var(--teal); color:var(--teal);}
  .node-body .n-title{font-size:13px; font-weight:600; line-height:1.3;}
  .node-body .n-sub{font-size:11px; color:var(--muted); font-family:var(--font-mono); margin-top:2px;}
  .node-progress{height:3px; background:var(--border-soft); border-radius:2px; margin-top:6px; overflow:hidden;}
  .node-progress i{display:block; height:100%; background:var(--teal); border-radius:2px; transition:width .3s ease;}

  .rail-foot{margin-top:22px; padding-top:16px; border-top:1px solid var(--border-soft);}
  .jump-link{display:block; font-size:12px; color:var(--muted); padding:6px 10px; border-radius:7px;}
  .jump-link:hover{background:var(--panel-raised); color:var(--text);}

  /* ---------- Main ---------- */
  main{padding:28px 32px 80px; max-width:980px; width:100%; margin:0 auto;}
  @media (max-width:640px){ main{padding:18px 16px 60px;} }

  section.hero{
    background:linear-gradient(160deg,var(--panel-raised),var(--panel));
    border:1px solid var(--border); border-radius:var(--radius);
    padding:28px; margin-bottom:26px;
    position:relative; overflow:hidden;
  }
  section.hero::after{
    content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle,rgba(45,212,191,.14),transparent 70%);
  }
  .hero-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--teal); letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px;}
  .hero h1{font-family:var(--font-display); font-size:clamp(24px,4vw,32px); font-weight:700; letter-spacing:-.02em; margin-bottom:10px;}
  .hero p{color:var(--muted); font-size:14.5px; max-width:58ch;}
  .hero-stats{display:flex; gap:22px; margin-top:20px; flex-wrap:wrap;}
  .hstat .v{font-family:var(--font-mono); font-size:19px; font-weight:700; color:var(--teal);}
  .hstat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}

  .stage-header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .stage-num{font-family:var(--font-mono); color:var(--teal); font-size:12.5px; letter-spacing:.08em;}
  .stage-title{font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-.015em; margin-top:4px;}
  .stage-sub{color:var(--muted); font-size:14px; margin-top:6px; max-width:60ch;}
  .stage-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:2px;}
  .chip{
    font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:999px;
    background:var(--panel-raised); border:1px solid var(--border); color:var(--muted); white-space:nowrap;
  }
  .chip.time{color:var(--amber); border-color:rgba(242,169,59,.35);}

  .tabs{display:flex; gap:6px; margin:20px 0 4px; overflow-x:auto; padding-bottom:6px; border-bottom:1px solid var(--border-soft);}
  .tab-btn{
    background:none; border:none; color:var(--muted); padding:8px 12px; font-size:12.5px; font-weight:600;
    border-radius:8px 8px 0 0; white-space:nowrap; border-bottom:2px solid transparent;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--teal); border-bottom-color:var(--teal);}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; margin-bottom:16px;
  }
  .card h3{font-family:var(--font-display); font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .card h3 .dot{width:7px; height:7px; border-radius:50%; background:var(--teal);}
  ul.plain{list-style:none;}
  ul.plain li{
    position:relative; padding:8px 0 8px 20px; font-size:14px; color:var(--text); border-bottom:1px solid var(--border-soft);
  }
  ul.plain li:last-child{border-bottom:none;}
  ul.plain li::before{content:"—"; position:absolute; left:0; color:var(--muted2);}

  .task-row{
    display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft);
  }
  .task-row:last-child{border-bottom:none;}
  .task-check{
    width:19px; height:19px; border-radius:5px; border:2px solid var(--border); flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .task-check.checked{background:var(--teal); border-color:var(--teal);}
  .task-check.checked::after{content:"✓"; color:var(--void); font-size:12px; font-weight:800;}
  .task-text{font-size:14px; flex:1;}
  .task-row.checked .task-text{color:var(--muted2); text-decoration:line-through;}
  .star-btn{background:none; border:none; color:var(--muted2); font-size:15px; flex-shrink:0;}
  .star-btn.on{color:var(--amber);}

  .tool-card{
    border:1px solid var(--border); border-radius:11px; padding:15px; background:var(--panel-raised);
    margin-bottom:12px;
  }
  .tool-card .th{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .tool-name{font-weight:700; font-size:14.5px;}
  .tool-alt{font-family:var(--font-mono); font-size:11px; color:var(--muted);}
  .tool-why{font-size:13px; color:var(--muted); line-height:1.55;}

  .prompt-block{
    background:var(--void); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--teal); line-height:1.6; margin-bottom:10px;
    position:relative; white-space:pre-wrap;
  }
  [data-theme="light"] .prompt-block{color:var(--teal-dim);}
  .copy-btn{
    position:absolute; top:8px; right:8px; background:var(--panel-raised); border:1px solid var(--border);
    color:var(--muted); font-size:10.5px; padding:4px 8px; border-radius:6px; font-family:var(--font-body); font-weight:600;
  }
  .copy-btn:hover{color:var(--teal); border-color:var(--teal);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:700px){ .grid2{grid-template-columns:1fr;} }

  .mistake-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:14px;}
  .mistake-item:last-child{border-bottom:none;}
  .mistake-item .x{color:var(--coral); font-weight:800; flex-shrink:0;}

  .tip-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:14px;}
  .tip-item:last-child{border-bottom:none;}
  .tip-item .b{color:var(--amber); flex-shrink:0;}

  textarea.notes{
    width:100%; min-height:100px; background:var(--void); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:var(--font-body); font-size:13.5px; padding:12px; resize:vertical;
  }
  textarea.notes:focus{outline:none; border-color:var(--teal);}
  .save-hint{font-size:11px; color:var(--muted2); margin-top:6px; font-family:var(--font-mono);}

  .stage-nav-btns{display:flex; justify-content:space-between; margin-top:22px; gap:10px;}

  /* Decision tree */
  .dtree{border:1px solid var(--border); border-radius:var(--radius); padding:22px; background:var(--panel);}
  .dtree-q{font-size:15px; font-weight:600; margin-bottom:14px;}
  .dtree-opts{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .dtree-opt{
    background:var(--panel-raised); border:1px solid var(--border); padding:10px 16px; border-radius:9px; font-size:13.5px; font-weight:600;
  }
  .dtree-opt:hover{border-color:var(--teal);}
  .dtree-path{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .dtree-path span{font-family:var(--font-mono); font-size:11px; background:var(--panel-raised2); padding:4px 9px; border-radius:6px; color:var(--muted);}
  .dtree-result{
    background:var(--panel-raised); border:1px solid var(--teal); border-radius:10px; padding:16px; margin-top:6px;
  }
  .dtree-result .rt{font-family:var(--font-mono); font-size:11px; color:var(--teal); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}

  table.cmp{width:100%; border-collapse:collapse; font-size:13px;}
  table.cmp th, table.cmp td{padding:10px 12px; border-bottom:1px solid var(--border-soft); text-align:left;}
  table.cmp th{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
  table.cmp tr:hover td{background:var(--panel-raised);}
  .tag{display:inline-block; font-size:10.5px; font-family:var(--font-mono); padding:2px 7px; border-radius:5px; background:var(--panel-raised2); color:var(--teal); margin:2px 3px 0 0;}

  footer.siteFoot{
    grid-column:1/-1; text-align:center; padding:26px; color:var(--muted2); font-size:12px; border-top:1px solid var(--border); font-family:var(--font-mono);
  }

  .bookmarks-panel{position:fixed; right:0; top:69px; width:320px; max-width:90vw; height:calc(100vh - 69px);
    background:var(--panel); border-left:1px solid var(--border); z-index:60; transform:translateX(100%);
    transition:transform .28s ease; overflow-y:auto; padding:20px;}
  .bookmarks-panel.open{transform:translateX(0);}
  .bm-item{background:var(--panel-raised); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px; font-size:13px;}
  .bm-item .bm-stage{font-family:var(--font-mono); font-size:10.5px; color:var(--teal); margin-bottom:4px;}

  @media print{
    nav.rail, header.topbar, .stage-nav-btns, .tabs, .bookmarks-panel{display:none !important;}
    body{background:#fff; color:#000;}
    .card{break-inside:avoid; border-color:#ccc;}
    main{max-width:100%;}
  }
</style>
</head>
<body data-theme="dark">
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">FV</div>
      <div class="brand-text">
        <div class="t1">Founder's Validation Lab</div>
        <div class="t2">Idea → MVP · Solo Founder Track</div>
      </div>
    </div>
    <div class="meter-wrap">
      <span class="meter-label">Confidence</span>
      <div class="meter" id="meterBars"></div>
      <span class="meter-pct" id="meterPct">0%</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="bookmarkToggle" title="Bookmarks">★</button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
      <button class="btn" id="printBtn">Print Guide</button>
    </div>
  </header>

  <nav class="rail" id="rail"></nav>

  <main id="main"></main>

  <footer class="siteFoot">FOUNDER'S VALIDATION LAB — BUILT WITH THE AI WORKFLOW ARCHITECT — YOUR PROGRESS SAVES LOCALLY, ON THIS DEVICE, IN THIS BROWSER</footer>
</div>

<div class="bookmarks-panel" id="bmPanel">
  <h3 style="font-family:var(--font-display); margin-bottom:14px;">Bookmarked Tasks</h3>
  <div id="bmList"></div>
</div>

<script>
(function(){
"use strict";

/* ===================== helpers ===================== */
function el(tag, props, children){
  const node = document.createElement(tag);
  if(props){
    for(const k in props){
      if(k === "class") node.className = props[k];
      else if(k === "text") node.textContent = props[k];
      else if(k.startsWith("on") && typeof props[k] === "function") node.addEventListener(k.slice(2), props[k]);
      else node.setAttribute(k, props[k]);
    }
  }
  if(children){
    (Array.isArray(children) ? children : [children]).forEach(c=>{
      if(c === null || c === undefined) return;
      if(typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
  }
  return node;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

const STORE_KEY = "founderValidationLab_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {tasks:{}, notes:{}, bookmarks:{}, theme:"dark", activeStage:0};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();

/* ===================== data ===================== */
const stages = [
{
  id:"framing", title:"Idea Capture & Problem Framing", sub:"Turn a vague spark into a falsifiable problem statement you can actually test.",
  time:"2–4 hours",
  objectives:[
    "Convert the raw idea into a single, testable problem statement",
    "Identify who specifically has this problem (not 'everyone')",
    "Separate assumptions from facts you already know",
    "Define what 'validated' will mean before you start"
  ],
  tasks:[
    "Write the idea as one sentence: [who] struggles with [problem] when [context]",
    "List every assumption baked into that sentence and mark each as fact or guess",
    "Draft 3 alternative problem framings in case the first is too broad",
    "Define your kill criteria — what result would make you drop this idea"
  ],
  aiTools:[
    {name:"Claude", why:"Best for structured reasoning — pressure-tests a problem statement, surfaces hidden assumptions, and rewrites vague framing into something falsifiable.", alt:"ChatGPT, Gemini"},
    {name:"Notion AI", why:"Keeps the framing, assumptions log, and kill-criteria in one living document you'll reference for the rest of the process.", alt:"Obsidian, Coda"}
  ],
  prompts:[
    "Here is my raw startup idea: [idea]. Rewrite it as a single testable problem statement in the form '[who] struggles with [problem] when [context]', then list every assumption hidden inside that sentence.",
    "Given this problem statement: [statement], propose 3 alternative framings that narrow the target user further, and explain what each framing would let me test that the others wouldn't."
  ],
  bestPractices:[
    "Write the problem statement before you think about the solution at all",
    "Name a specific person or role, not a demographic ('freelance video editors', not 'creators')",
    "Keep the first framing narrow — you can always widen later, narrowing later is expensive"
  ],
  mistakes:[
    "Starting from the solution ('I want to build an app that...') instead of the problem",
    "Defining the user as 'everyone' or 'small businesses' — too broad to interview or market to",
    "Skipping kill criteria, which makes it easy to rationalize a bad result later"
  ],
  outputs:["One-sentence problem statement", "Assumptions log (fact vs. guess)", "Kill criteria document"],
  tips:["Timebox this stage hard — 4 hours max. Framing can be revisited after real customer signal."]
},
{
  id:"research", title:"Market & Competitor Research", sub:"Map who else is solving this, how big the opportunity is, and where the gaps are.",
  time:"1–2 days",
  objectives:[
    "Identify direct and adjacent competitors",
    "Estimate rough market size and willingness to pay",
    "Find the gap your framing exploits that incumbents don't cover",
    "Decide if the market is a 'yes, but crowded' or a genuine white space"
  ],
  tasks:[
    "Search for 5–10 direct competitors and 5 adjacent/indirect ones",
    "Build a comparison table: pricing, target user, core feature, weakness",
    "Pull 15–20 minutes of recent reviews or complaints about each competitor",
    "Draft a rough TAM/SAM/SOM estimate using public data",
    "Write a one-paragraph 'why now' — what's changed that makes this newly viable"
  ],
  aiTools:[
    {name:"Claude (with web search)", why:"Synthesizes competitor research, review complaints, and market sizing into a structured brief instead of 20 open tabs.", alt:"Perplexity, ChatGPT with browsing"},
    {name:"G2 / Capterra / App Store reviews", why:"Real user complaints about competitors are the highest-signal source of unmet needs — feed these into an AI summarizer.", alt:"Reddit, Product Hunt comments"},
    {name:"Exploding Topics / Google Trends", why:"Quick sanity check on whether interest in the space is rising, flat, or declining.", alt:"SimilarWeb, SEMrush"}
  ],
  prompts:[
    "Research direct and indirect competitors for a product that solves: [problem statement]. For each, give me pricing model, core feature, and the single biggest complaint from real user reviews.",

const decisionTree = {
  q:"Did at least 60% of your discovery interviews show strong pain signal (frequent + intense + an existing workaround they already pay time or money for)?",
  yes:{
    q:"Did your landing page smoke test hit your pre-set conversion threshold?",
    yes:{
      q:"After beta, did day-7 retention clear a level you'd be proud to show an investor?",
      yes:{result:"GO — Scale the MVP", detail:"You have evidence at three separate layers: stated pain, demonstrated intent, and actual behavior. Move from MVP to a real roadmap, and start thinking about acquisition channels and monetization structure."},
      no:{result:"ITERATE — Fix retention before scaling", detail:"People wanted in, but the product isn't sticking. Go back to churned-user interviews before writing more code — you likely have an onboarding or core-value-delivery gap, not a market gap."}
    },
    no:{result:"ITERATE — Fix the offer, not the market", detail:"The pain is real but your pitch isn't converting. Revisit your landing page copy and value proposition using the exact language from interviews before assuming the idea itself is wrong."}
  },

    q:"Was the signal weak because the problem is niche-but-real, or because it isn't actually painful?",

    "notPainful":{result:"KILL — Return to problem framing", detail:"Without real pain, no amount of good execution will save this. Take the assumptions log from Stage 1 and start over with a different problem statement — this is a fast, cheap outcome, not a failure."}

/* ===================== render: rail ===================== */
function taskProgress(stage){
  const total = stage.tasks.length;
  let done = 0;
  stage.tasks.forEach((t,i)=>{ if(state.tasks[stage.id+"_"+i]) done++; });
  return {done, total};
}
function overallProgress(){
  let done=0, total=0;
  stages.forEach(s=>{ const p=taskProgress(s); done+=p.done; total+=p.total; });
  return total ? done/total : 0;
}

function renderMeter(){
  const bars = document.getElementById("meterBars");
  clear(bars);
  const pct = overallProgress();
  const litCount = Math.round(pct*10);
  for(let i=0;i<10;i++){
    bars.appendChild(el("i", {class: i<litCount ? "on":""}));
  }
  document.getElementById("meterPct").textContent = Math.round(pct*100)+"%";
}

function renderRail(){
  const rail = document.getElementById("rail");
  clear(rail);
  rail.appendChild(el("div",{class:"rail-heading",text:"Validation Pipeline"}));
  const pipe = el("div",{class:"pipe"});
  stages.forEach((s, idx)=>{
    const p = taskProgress(s);
    const isDone = p.total>0 && p.done===p.total;
    const isActive = state.activeStage === idx;
    const node = el("div",{class:"stage-node"+(isActive?" active":"")+(isDone?" done":""), onclick:()=>{ state.activeStage = idx; saveState(); renderAll(); document.getElementById("main").scrollIntoView({behavior:"smooth"}); }},[
      el("div",{class:"connector"}),
      el("div",{class:"node-dot",text: isDone ? "✓" : String(idx+1)}),
      el("div",{class:"node-body"},[
        el("div",{class:"n-title",text:s.title}),
        el("div",{class:"n-sub",text:p.done+"/"+p.total+" tasks · "+s.time}),
        el("div",{class:"node-progress"},[ el("i",{style:"width:"+(p.total? (p.done/p.total*100):0)+"%"}) ])
      ])
    ]);
    pipe.appendChild(node);
  });
  rail.appendChild(pipe);

  const foot = el("div",{class:"rail-foot"});
  [["Decision Tree","#decision-tree"],["Workflow Summary","#summary"],["Recommended AI Stack","#stack"],["Resources & Communities","#resources"],["Future Automation","#automation"]].forEach(([label,href])=>{
    foot.appendChild(el("a",{class:"jump-link", href:href, text:label, onclick:()=>{ setTimeout(()=>{ document.querySelector(href)?.scrollIntoView({behavior:"smooth"}); },10); }}));
  });
  rail.appendChild(foot);
}

let dtPath = [];
function renderDecisionTree(){
  const wrap = el("section",{id:"decision-tree", style:"margin-top:32px;"});
  wrap.appendChild(sectionTitle("Interactive Decision Tree", "Should you go, iterate, pivot, or kill?"));
  const box = el("div",{class:"dtree"});

  let node = decisionTree;
  const pathTrail = el("div",{class:"dtree-path"});
  dtPath.forEach(p=>pathTrail.appendChild(el("span",{text:p})));
  box.appendChild(pathTrail);

  for(const step of dtPath){
    if(node.result) break;
    if(step==="Yes" && node.yes) node = node.yes;
    else if(step==="No" && node.no) node = node.no;
    else if(step==="Niche-but-real" && node["niche"]) node = node["niche"];
    else if(step==="Not painful" && node["notPainful"]) node = node["notPainful"];
  }

  if(node.result){
    box.appendChild(el("div",{class:"dtree-result"},[
      el("div",{class:"rt",text:node.result}),
      el("div",{text:node.detail})
    ]));
    box.appendChild(el("button",{class:"btn", style:"margin-top:14px;", onclick:()=>{ dtPath=[]; renderAll(); }}, "Start Over"));
  } else {
    box.appendChild(el("div",{class:"dtree-q", text:node.q}));
    const opts = el("div",{class:"dtree-opts"});
    let choices = ["Yes","No"];
    if(node===decisionTree.no) choices = ["Niche-but-real","Not painful"];
    choices.forEach(c=>{
      opts.appendChild(el("button",{class:"dtree-opt", onclick:()=>{ dtPath.push(c); renderAll(); }}, c));
    });
    box.appendChild(opts);
    if(dtPath.length>0){
      box.appendChild(el("button",{class:"btn", onclick:()=>{ dtPath=[]; renderAll(); }}, "Reset"));
    }
  }
  wrap.appendChild(box);
  return wrap;
}

function sectionTitle(title, sub){

}

function renderBookmarks(){
  const list = document.getElementById("bmList");
  clear(list);
  const keys = Object.keys(state.bookmarks);
  if(keys.length===0){
    list.appendChild(el("p",{style:"color:var(--muted); font-size:13px;", text:"No bookmarks yet — star any task to save it here."}));
    return;
  }
  keys.forEach(k=>{
    const bm = state.bookmarks[k];
    list.appendChild(el("div",{class:"bm-item"},[
      el("div",{class:"bm-stage",text:bm.stage}),
      el("div",{text:bm.text})
    ]));
  });
}
