<!DOCTYPE html>
<html lang="en">
<head>

    --bg3: #181d2a;
    --bg4: #1e2435;
    --border: rgba(255,255,255,0.08);

    --text3: #5c647a;

    --accent2: #3d7aef;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --pink: #f472b6;

    --radius2: 8px;
    --radius3: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow2: 0 2px 12px rgba(0,0,0,0.3);

  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes barFill { from { width: 0%; } to { width: var(--target-width); } }
  @keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.5s ease forwards; }
  .slide-in { animation: slideIn 0.4s ease forwards; }
  .count-up { animation: countUp 0.6s ease forwards; }
  button { cursor: pointer; font-family: inherit; transition: all 0.2s ease; }
  button:active { transform: scale(0.97); }
</style>
</head>

  { id: 'air_freight', label: 'Switch to Air Freight', icon: '✈️', cost: -20, inventory: +5, profit: -18, speed: +20, satisfaction: +15, description: 'Air freight is 4-6x more expensive than sea but dramatically cuts transit time.' },

      { label: 'Decline exclusivity, offer 40% guaranteed volume instead', trust: +10, price: 0, lead: +2, note: 'Volume certainty for them, flexibility for you.' },

const AI_INVESTMENTS = [

function generateCompany() {
  const base = pick(COMPANIES);
  return {
    name: pick(COMPANY_NAMES),
    industry: base.industry,
    icon: base.icon,
    color: base.color,
    revenue: `$${rand(80, 950)}M`,
    factories: rand(2, 12),
    warehouses: rand(4, 22),
    suppliers: rand(15, 200),
    inventoryDays: rand(18, 90),
    leadTime: `${rand(3, 16)} weeks`,
    countries: pickN(COUNTRIES, rand(3, 7)),
    employees: `${rand(500, 15000).toLocaleString()}`,
  };
}
function generateCrisis() {
  const c = pick(CRISES);
  return { ...c, financialRisk: `$${rand(5, 80)}M`, timeWindow: `${rand(5, 21)} days` };
}

// ---- Components ----

function Btn({ children, onClick, style = {}, variant = 'primary', disabled = false }) {
  const base = {
    border: 'none', borderRadius: '8px', fontWeight: 600, fontSize: '15px',
    padding: '12px 24px', cursor: disabled ? 'not-allowed' : 'pointer',
    transition: 'all 0.2s ease', display: 'inline-flex', alignItems: 'center', gap: '8px',
    opacity: disabled ? 0.5 : 1,
  };
  const variants = {
    primary: { background: 'linear-gradient(135deg, #4f8ef7, #3d7aef)', color: '#fff', boxShadow: '0 2px 12px rgba(79,142,247,0.35)' },
    secondary: { background: 'rgba(255,255,255,0.08)', color: '#e8eaf0', border: '1px solid rgba(255,255,255,0.15)' },
    danger: { background: 'linear-gradient(135deg, #f87171, #ef4444)', color: '#fff' },
    success: { background: 'linear-gradient(135deg, #34d399, #10b981)', color: '#fff' },
    ghost: { background: 'transparent', color: '#9ba3b8', border: '1px solid rgba(255,255,255,0.1)' },
  };
  return (
    <button style={{ ...base, ...variants[variant], ...style }} onClick={disabled ? undefined : onClick}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.filter = 'brightness(1.1)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.filter = 'brightness(1)'; }}>
      {children}
    </button>
  );
}

function Card({ children, style = {}, glow }) {
  return (
    <div style={{
      background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.09)',
      borderRadius: '14px', padding: '20px',
      boxShadow: glow ? `0 0 0 1px ${glow}33, 0 4px 24px rgba(0,0,0,0.3)` : '0 2px 16px rgba(0,0,0,0.25)',
      ...style
    }}>{children}</div>
  );
}

function ProgressBar({ value, max = 100, color = '#4f8ef7', label, showValue = true, animated = false }) {
  const pct = Math.round(clamp((value / max) * 100, 0, 100));
  return (
    <div style={{ marginBottom: '10px' }}>
      {(label || showValue) && (
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', fontSize: '13px', color: '#9ba3b8' }}>
          <span>{label}</span>
          {showValue && <span style={{ color, fontWeight: 600 }}>{Math.round(value)}</span>}
        </div>
      )}
      <div style={{ background: 'rgba(255,255,255,0.08)', borderRadius: '6px', height: '8px', overflow: 'hidden' }}>
        <div style={{
          height: '100%', borderRadius: '6px', background: `linear-gradient(90deg, ${color}99, ${color})`,
          width: `${pct}%`,
          transition: animated ? 'width 1.2s cubic-bezier(0.4,0,0.2,1)' : 'none',
          boxShadow: `0 0 8px ${color}66`,
        }} />
      </div>
    </div>
  );
}

function Badge({ children, color = '#4f8ef7' }) {
  return (
    <span style={{
      background: `${color}22`, color, border: `1px solid ${color}44`,
      padding: '3px 10px', borderRadius: '20px', fontSize: '11px', fontWeight: 700, letterSpacing: '0.5px',
    }}>{children}</span>
  );
}

function StatCard({ label, value, sub, color = '#4f8ef7', icon }) {
  return (
    <Card style={{ textAlign: 'center', padding: '18px 14px' }}>
      {icon && <div style={{ fontSize: '24px', marginBottom: '8px' }}>{icon}</div>}
      <div style={{ fontSize: '11px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '6px' }}>{label}</div>
      <div style={{ fontSize: '24px', fontWeight: 700, color, marginBottom: '2px' }}>{value}</div>
      {sub && <div style={{ fontSize: '12px', color: '#5c647a' }}>{sub}</div>}
    </Card>
  );
}

function SectionHeader({ step, title, subtitle }) {
  return (
    <div style={{ textAlign: 'center', marginBottom: '32px' }} className="fade-in">
      <div style={{ color: '#4f8ef7', fontSize: '12px', fontWeight: 700, letterSpacing: '2px', textTransform: 'uppercase', marginBottom: '8px' }}>
        {step && `Step ${step} — `}{step ? '' : ''}{step ? title.split(' ')[0] : ''}
      </div>
      <h2 style={{ fontSize: '26px', fontWeight: 700, marginBottom: '10px', lineHeight: 1.2 }}>{title}</h2>
      {subtitle && <p style={{ color: '#9ba3b8', fontSize: '15px', maxWidth: '560px', margin: '0 auto', lineHeight: 1.6 }}>{subtitle}</p>}
    </div>
  );
}

function WhyBox({ text }) {
  return (

      <span style={{ color: '#4f8ef7', fontWeight: 700 }}>💡 Why this matters: </span>{text}

}

function WarRoomScreen({ onNext }) {
  const [selected, setSelected] = useState([]);
  const [revealed, setRevealed] = useState(false);
  const [metrics, setMetrics] = useState({ cost: 50, inventory: 50, profit: 50, speed: 50, satisfaction: 50 });
  const actions = useRef(pickN(ACTIONS, 6)).current;

  const toggle = (id) => {
    if (revealed) return;
    setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : prev.length < 3 ? [...prev, id] : prev);
  };

  const simulate = () => {
    const chosen = actions.filter(a => selected.includes(a.id));
    let m = { cost: 50, inventory: 50, profit: 50, speed: 50, satisfaction: 50 };
    chosen.forEach(a => {
      m.cost = clamp(m.cost + a.cost, 0, 100);
      m.inventory = clamp(m.inventory + a.inventory, 0, 100);
      m.profit = clamp(m.profit + a.profit, 0, 100);
      m.speed = clamp(m.speed + a.speed, 0, 100);
      m.satisfaction = clamp(m.satisfaction + a.satisfaction, 0, 100);
    });
    setMetrics(m);
    setRevealed(true);
  };

  const metricColor = v => v >= 65 ? '#34d399' : v >= 45 ? '#fbbf24' : '#f87171';

  return (
    <div style={{ maxWidth: '900px', margin: '0 auto', padding: '40px 20px' }}>
      <SectionHeader step={3} title="War Room: Crisis Response" subtitle="Choose exactly 3 response actions. Each one has tradeoffs — read them carefully. There's no perfect answer." />
      <WhyBox text="In a real supply chain crisis, you never have enough resources for everything. Prioritization is the skill. Pick actions that balance immediate fire-fighting with longer-term customer trust." />
      <div style={{ background: 'rgba(79,142,247,0.08)', border: '1px solid rgba(79,142,247,0.2)', borderRadius: '10px', padding: '12px 18px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: '14px', color: '#9ba3b8' }}>Actions selected:</span>
        <span style={{ fontSize: '18px', fontWeight: 700, color: selected.length === 3 ? '#34d399' : '#4f8ef7' }}>{selected.length} / 3</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '14px', marginBottom: '28px' }}>
        {actions.map((a, i) => {
          const isSelected = selected.includes(a.id);
          return (
            <div key={a.id} className="fade-in"
              onClick={() => toggle(a.id)}
              style={{
                background: isSelected ? 'rgba(79,142,247,0.12)' : 'rgba(255,255,255,0.04)',
                border: isSelected ? '1px solid rgba(79,142,247,0.5)' : '1px solid rgba(255,255,255,0.09)',
                borderRadius: '12px', padding: '16px', cursor: revealed ? 'default' : 'pointer',
                transition: 'all 0.2s ease',
                transform: isSelected ? 'translateY(-2px)' : 'none',
                opacity: !revealed && selected.length === 3 && !isSelected ? 0.5 : 1,
                animationDelay: `${i * 0.07}s`,
              }}
              onMouseEnter={e => { if (!revealed && !(selected.length === 3 && !isSelected)) { e.currentTarget.style.borderColor = 'rgba(79,142,247,0.4)'; e.currentTarget.style.transform = isSelected ? 'translateY(-2px)' : 'translateY(-1px)'; }}}
              onMouseLeave={e => { if (!revealed) { e.currentTarget.style.borderColor = isSelected ? 'rgba(79,142,247,0.5)' : 'rgba(255,255,255,0.09)'; e.currentTarget.style.transform = isSelected ? 'translateY(-2px)' : 'none'; }}}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '10px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{ fontSize: '20px' }}>{a.icon}</span>
                  <span style={{ fontWeight: 600, fontSize: '14px' }}>{a.label}</span>
                </div>
                {isSelected && <span style={{ color: '#4f8ef7', fontSize: '18px', fontWeight: 700 }}>✓</span>}
              </div>
              <p style={{ fontSize: '12px', color: '#9ba3b8', lineHeight: 1.6, marginBottom: '10px' }}>{a.description}</p>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                {[['Cost', a.cost], ['Inventory', a.inventory], ['Profit', a.profit], ['Speed', a.speed], ['Satisfaction', a.satisfaction]].map(([k, v]) => (
                  <span key={k} style={{ fontSize: '10px', padding: '2px 7px', borderRadius: '4px', background: v > 0 ? 'rgba(52,211,153,0.15)' : v < 0 ? 'rgba(248,113,113,0.15)' : 'rgba(255,255,255,0.06)', color: v > 0 ? '#34d399' : v < 0 ? '#f87171' : '#9ba3b8', border: `1px solid ${v > 0 ? 'rgba(52,211,153,0.3)' : v < 0 ? 'rgba(248,113,113,0.3)' : 'rgba(255,255,255,0.1)'}` }}>
                    {k} {v > 0 ? `+${v}` : v}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      {!revealed ? (
        <div style={{ textAlign: 'center' }}>
          <Btn onClick={simulate} disabled={selected.length !== 3} style={{ fontSize: '16px', padding: '14px 40px' }}>

          </Btn>
          {selected.length < 3 && <p style={{ marginTop: '12px', fontSize: '13px', color: '#5c647a' }}>Select {3 - selected.length} more action{3 - selected.length !== 1 ? 's' : ''}</p>}

      ) : (
        <div className="fade-in">
          <h3 style={{ fontSize: '18px', fontWeight: 700, marginBottom: '20px', textAlign: 'center' }}>📊 Simulated Outcomes</h3>
          <Card style={{ marginBottom: '24px' }}>
            {[['Cost Efficiency', metrics.cost, '#34d399'], ['Inventory Level', metrics.inventory, '#4f8ef7'], ['Profit Impact', metrics.profit, '#a78bfa'], ['Delivery Speed', metrics.speed, '#22d3ee'], ['Customer Satisfaction', metrics.satisfaction, '#f472b6']].map(([label, value, color]) => (
              <ProgressBar key={label} label={label} value={value} color={metricColor(value)} animated />
            ))}
          </Card>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '10px', marginBottom: '24px' }}>
            {[['Cost', metrics.cost, '#34d399'], ['Inventory', metrics.inventory, '#4f8ef7'], ['Profit', metrics.profit, '#a78bfa'], ['Speed', metrics.speed, '#22d3ee'], ['Satisfaction', metrics.satisfaction, '#f472b6']].map(([l, v, c]) => (
              <StatCard key={l} label={l} value={`${Math.round(v)}/100`} color={metricColor(v)} />
            ))}
          </div>
          <div style={{ textAlign: 'center' }}>
            <Btn onClick={() => onNext(metrics, selected.map(id => actions.find(a => a.id === id)))}>
              Proceed to Supplier Negotiation →
            </Btn>
          </div>
        </div>
      )}
    </div>
  );
}

function NegotiationScreen({ onNext }) {
  const [round, setRound] = useState(0);
  const [score, setScore] = useState({ trust: 40, price: 50, lead: 40 });
  const [history, setHistory] = useState([]);
  const [done, setDone] = useState(false);

  const choose = (opt) => {
    const newScore = {
      trust: clamp(score.trust + opt.trust, 0, 100),
      price: clamp(score.price + opt.price, 0, 100),
      lead: clamp(score.lead + opt.lead, 0, 100),
    };
    setScore(newScore);
    setHistory(prev => [...prev, { round: round + 1, label: opt.label, note: opt.note }]);
    if (round + 1 >= NEGOTIATION_ROUNDS.length) {
      setDone(true);
    } else {
      setRound(r => r + 1);
    }
  };

  const negScore = Math.round((score.trust * 0.4 + score.price * 0.35 + score.lead * 0.25));

  if (done) {
    return (
      <div style={{ maxWidth: '700px', margin: '0 auto', padding: '40px 20px' }} className="fade-in">
        <SectionHeader step={4} title="Negotiation Complete" subtitle="Here's how the supplier talks concluded. Your choices compounded across all four rounds." />
        <Card glow="#34d399" style={{ textAlign: 'center', marginBottom: '24px' }}>
          <div style={{ fontSize: '13px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Negotiation Score</div>
          <div style={{ fontSize: '56px', fontWeight: 800, color: negScore >= 70 ? '#34d399' : negScore >= 50 ? '#fbbf24' : '#f87171', marginBottom: '8px' }} className="count-up">{negScore}</div>
          <div style={{ fontSize: '14px', color: '#9ba3b8' }}>{negScore >= 70 ? 'Excellent deal secured' : negScore >= 50 ? 'Workable agreement reached' : 'Unfavorable terms accepted'}</div>
        </Card>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', marginBottom: '24px' }}>
          <StatCard label="Supplier Trust" value={`${Math.round(score.trust)}%`} color={score.trust >= 60 ? '#34d399' : '#fbbf24'} icon="🤝" />
          <StatCard label="Price Position" value={`${Math.round(score.price)}%`} color={score.price >= 55 ? '#34d399' : '#fbbf24'} icon="💲" />
          <StatCard label="Lead Time" value={`${Math.round(score.lead)}%`} color={score.lead >= 55 ? '#34d399' : '#fbbf24'} icon="⏱️" />
        </div>
        <Card style={{ marginBottom: '24px' }}>
          <div style={{ fontSize: '13px', color: '#5c647a', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '14px' }}>Decision Log</div>
          {history.map((h, i) => (
            <div key={i} style={{ display: 'flex', gap: '12px', marginBottom: '12px', paddingBottom: '12px', borderBottom: i < history.length - 1 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
              <div style={{ width: '24px', height: '24px', borderRadius: '50%', background: 'rgba(79,142,247,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', color: '#4f8ef7', fontWeight: 700, flexShrink: 0 }}>R{h.round}</div>
              <div>
                <div style={{ fontSize: '13px', fontWeight: 600, marginBottom: '2px' }}>{h.label}</div>
                <div style={{ fontSize: '12px', color: '#9ba3b8' }}>{h.note}</div>
              </div>
            </div>
          ))}
        </Card>
        <div style={{ textAlign: 'center' }}>
          <Btn onClick={() => onNext(negScore)}>Enter the CEO Boardroom →</Btn>
        </div>
      </div>
    );
  }

  const r = NEGOTIATION_ROUNDS[round];
  return (
    <div style={{ maxWidth: '760px', margin: '0 auto', padding: '40px 20px' }}>
      <SectionHeader step={4} title="Supplier Negotiation" subtitle="4 rounds. Every choice affects trust, price, and lead time. Think like a negotiator, not a desperate buyer." />
      <div style={{ display: 'flex', justifyContent: 'center', gap: '8px', marginBottom: '28px' }}>
        {NEGOTIATION_ROUNDS.map((_, i) => (
          <div key={i} style={{ width: '36px', height: '6px', borderRadius: '3px', background: i < round ? '#34d399' : i === round ? '#4f8ef7' : 'rgba(255,255,255,0.1)', transition: 'all 0.3s ease' }} />
        ))}
      </div>
      <Card style={{ marginBottom: '16px' }} className="fade-in">
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px' }}>
          <Badge color="#4f8ef7">Round {round + 1} of 4</Badge>
          <Badge color="#a78bfa">{r.title}</Badge>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', marginBottom: '16px' }}>
          {[['Trust', score.trust, '#34d399'], ['Price Score', score.price, '#4f8ef7'], ['Lead Time', score.lead, '#a78bfa']].map(([l, v, c]) => (
            <div key={l} style={{ background: 'rgba(255,255,255,0.04)', borderRadius: '8px', padding: '10px', textAlign: 'center' }}>
              <div style={{ fontSize: '10px', color: '#5c647a', marginBottom: '4px', textTransform: 'uppercase' }}>{l}</div>
              <div style={{ fontSize: '20px', fontWeight: 700, color: c }}>{Math.round(v)}</div>
            </div>
          ))}
        </div>
        <div style={{ background: 'rgba(255,255,255,0.03)', borderRadius: '8px', padding: '14px', marginBottom: '12px' }}>
          <p style={{ fontSize: '15px', color: '#c8cad6', lineHeight: 1.7 }}>{r.context}</p>
        </div>
        <WhyBox text={r.why} />
      </Card>
      <div style={{ display: 'grid', gap: '10px', marginBottom: '16px' }}>
        {r.options.map((opt, i) => (
          <div key={i} className="slide-in" style={{ animationDelay: `${i * 0.08}s`,
            background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.09)', borderRadius: '10px', padding: '16px',
            cursor: 'pointer', transition: 'all 0.2s ease' }}
            onClick={() => choose(opt)}
            onMouseEnter={e => { e.currentTarget.style.background = 'rgba(79,142,247,0.1)'; e.currentTarget.style.borderColor = 'rgba(79,142,247,0.4)'; e.currentTarget.style.transform = 'translateX(4px)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.09)'; e.currentTarget.style.transform = 'none'; }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, marginBottom: '4px', fontSize: '14px' }}>{String.fromCharCode(65 + i)}. {opt.label}</div>
                <div style={{ fontSize: '12px', color: '#9ba3b8' }}>{opt.note}</div>
              </div>
              <div style={{ display: 'flex', gap: '4px', flexShrink: 0, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                {[['T', opt.trust], ['P', opt.price], ['L', opt.lead]].map(([k, v]) => (
                  <span key={k} style={{ fontSize: '10px', padding: '2px 6px', borderRadius: '4px', background: v > 0 ? 'rgba(52,211,153,0.15)' : v < 0 ? 'rgba(248,113,113,0.15)' : 'rgba(255,255,255,0.06)', color: v > 0 ? '#34d399' : v < 0 ? '#f87171' : '#9ba3b8' }}>
                    {k}{v > 0 ? `+${v}` : v}
                  </span>
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function CEOScreen({ onNext }) {
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [done, setDone] = useState(false);
  const [selected, setSelected] = useState(null);

  const choose = (opt) => {
    setSelected(opt);
    setTimeout(() => {
      const newAnswers = [...answers, { q: CEO_QUESTIONS[current].q, chosen: opt }];
      setAnswers(newAnswers);
      setSelected(null);
      if (current + 1 >= CEO_QUESTIONS.length) {
        setDone(true);
      } else {
        setCurrent(c => c + 1);
      }
    }, 1200);
  };

  const totalScore = answers.reduce((sum, a) => sum + a.chosen.score, 0);
  const leadershipScore = Math.round(totalScore / CEO_QUESTIONS.length);

  if (done) {
    return (
      <div style={{ maxWidth: '700px', margin: '0 auto', padding: '40px 20px' }} className="fade-in">
        <SectionHeader step={5} title="Boardroom Review" subtitle="Here's how your executive decisions scored across all five scenarios." />
        <Card glow="#a78bfa" style={{ textAlign: 'center', marginBottom: '24px' }}>
          <div style={{ fontSize: '13px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Leadership Score</div>
          <div style={{ fontSize: '56px', fontWeight: 800, color: leadershipScore >= 70 ? '#34d399' : leadershipScore >= 50 ? '#fbbf24' : '#f87171', marginBottom: '8px' }} className="count-up">{leadershipScore}</div>
          <div style={{ fontSize: '14px', color: '#9ba3b8' }}>{leadershipScore >= 75 ? '🏆 Exceptional CEO-level thinking' : leadershipScore >= 60 ? '👍 Strong executive judgment' : leadershipScore >= 45 ? '⚠️ Some critical missteps' : '🔴 Leadership blind spots revealed'}</div>
        </Card>
        <Card style={{ marginBottom: '24px' }}>
          {answers.map((a, i) => (
            <div key={i} style={{ marginBottom: '16px', paddingBottom: '16px', borderBottom: i < answers.length - 1 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
              <div style={{ fontSize: '12px', color: '#5c647a', marginBottom: '4px' }}>Q{i + 1}</div>
              <div style={{ fontSize: '13px', fontWeight: 600, marginBottom: '6px', color: '#c8cad6' }}>{a.q.length > 80 ? a.q.slice(0, 80) + '...' : a.q}</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ fontSize: '12px', color: '#9ba3b8', flex: 1, marginRight: '10px' }}>{a.chosen.feedback}</div>
                <Badge color={a.chosen.score >= 70 ? '#34d399' : a.chosen.score >= 50 ? '#fbbf24' : '#f87171'}>{a.chosen.score}/100</Badge>
              </div>
            </div>
          ))}
        </Card>
        <div style={{ textAlign: 'center' }}>
          <Btn onClick={() => onNext(leadershipScore)}>Choose AI Investments →</Btn>
        </div>
      </div>
    );
  }

  const q = CEO_QUESTIONS[current];
  return (
    <div style={{ maxWidth: '760px', margin: '0 auto', padding: '40px 20px' }}>
      <SectionHeader step={5} title="CEO Boardroom" subtitle="Five leadership scenarios. Every choice here reveals how you think under pressure. There are better and worse answers." />
      <div style={{ display: 'flex', justifyContent: 'center', gap: '8px', marginBottom: '28px' }}>
        {CEO_QUESTIONS.map((_, i) => (
          <div key={i} style={{ width: '36px', height: '6px', borderRadius: '3px', background: i < current ? '#a78bfa' : i === current ? '#4f8ef7' : 'rgba(255,255,255,0.1)', transition: 'all 0.3s' }} />
        ))}
      </div>
      <Card style={{ marginBottom: '20px' }} className="fade-in">
        <div style={{ marginBottom: '14px' }}>
          <Badge color="#a78bfa">Scenario {current + 1} of 5</Badge>
        </div>
        <div style={{ background: 'rgba(255,255,255,0.03)', borderRadius: '8px', padding: '16px', marginBottom: '14px' }}>
          <p style={{ fontSize: '16px', fontWeight: 600, lineHeight: 1.6 }}>{q.q}</p>
        </div>
        <WhyBox text={q.context} />
      </Card>
      <div style={{ display: 'grid', gap: '10px' }}>
        {q.options.map((opt, i) => {
          const isSelected = selected === opt;
          return (
            <div key={i} className="slide-in" style={{ animationDelay: `${i * 0.08}s`,
              background: isSelected ? 'rgba(167,139,250,0.15)' : 'rgba(255,255,255,0.04)',
              border: isSelected ? '1px solid rgba(167,139,250,0.5)' : '1px solid rgba(255,255,255,0.09)',
              borderRadius: '10px', padding: '16px', cursor: selected ? 'default' : 'pointer', transition: 'all 0.2s ease' }}
              onClick={() => !selected && choose(opt)}
              onMouseEnter={e => { if (!selected) { e.currentTarget.style.background = 'rgba(167,139,250,0.08)'; e.currentTarget.style.borderColor = 'rgba(167,139,250,0.3)'; }}}
              onMouseLeave={e => { if (!selected) { e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.09)'; }}}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ width: '28px', height: '28px', borderRadius: '50%', border: `2px solid ${isSelected ? '#a78bfa' : 'rgba(255,255,255,0.2)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', color: isSelected ? '#a78bfa' : '#5c647a', flexShrink: 0, fontWeight: 700 }}>
                  {isSelected ? '✓' : String.fromCharCode(65 + i)}
                </div>
                <span style={{ fontSize: '14px', fontWeight: isSelected ? 600 : 400 }}>{opt.label}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AIStrategyScreen({ onNext }) {
  const [selected, setSelected] = useState([]);
  const [revealed, setRevealed] = useState(false);

  const toggle = (id) => {
    if (revealed) return;
    setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : prev.length < 2 ? [...prev, id] : prev);
  };

  const totalImpact = () => {
    const chosen = AI_INVESTMENTS.filter(a => selected.includes(a.id));
    const base = { cost: 0, inventory: 0, profit: 0, speed: 0, satisfaction: 0 };
    chosen.forEach(a => {
      Object.keys(base).forEach(k => { base[k] = clamp(base[k] + a.impacts[k], 0, 100); });
    });
    return base;
  };

  return (
    <div style={{ maxWidth: '900px', margin: '0 auto', padding: '40px 20px' }}>
      <SectionHeader step={6} title="AI Investment Strategy" subtitle="Crisis managed. Now future-proof your supply chain. Choose 2 AI capabilities to implement. Each has a different ROI profile." />
      <WhyBox text="AI doesn't replace supply chain judgment — it augments it. The best investments address the specific vulnerabilities this crisis exposed. Think about what information or automation would have prevented or mitigated what just happened." />
      <div style={{ background: 'rgba(167,139,250,0.08)', border: '1px solid rgba(167,139,250,0.2)', borderRadius: '10px', padding: '12px 18px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: '14px', color: '#9ba3b8' }}>Investments selected:</span>
        <span style={{ fontSize: '18px', fontWeight: 700, color: selected.length === 2 ? '#34d399' : '#a78bfa' }}>{selected.length} / 2</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '14px', marginBottom: '28px' }}>
        {AI_INVESTMENTS.map((ai, i) => {
          const isSelected = selected.includes(ai.id);
          return (
            <div key={ai.id} className="fade-in"
              onClick={() => toggle(ai.id)}
              style={{
                background: isSelected ? `${ai.color}12` : 'rgba(255,255,255,0.04)',
                border: isSelected ? `1px solid ${ai.color}50` : '1px solid rgba(255,255,255,0.09)',
                borderRadius: '12px', padding: '18px', cursor: revealed ? 'default' : 'pointer',
                transition: 'all 0.2s ease',
                transform: isSelected ? 'translateY(-3px)' : 'none',
                opacity: !revealed && selected.length === 2 && !isSelected ? 0.4 : 1,
                animationDelay: `${i * 0.08}s`,
              }}
              onMouseEnter={e => { if (!revealed && !(selected.length === 2 && !isSelected)) { e.currentTarget.style.borderColor = `${ai.color}60`; e.currentTarget.style.transform = isSelected ? 'translateY(-3px)' : 'translateY(-1px)'; }}}
              onMouseLeave={e => { if (!revealed) { e.currentTarget.style.borderColor = isSelected ? `${ai.color}50` : 'rgba(255,255,255,0.09)'; e.currentTarget.style.transform = isSelected ? 'translateY(-3px)' : 'none'; }}}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '10px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span style={{ fontSize: '22px' }}>{ai.icon}</span>
                  <span style={{ fontWeight: 700, fontSize: '14px', color: isSelected ? ai.color : '#e8eaf0' }}>{ai.name}</span>
                </div>
                {isSelected && <span style={{ color: ai.color, fontWeight: 700, fontSize: '18px' }}>✓</span>}
              </div>
              <p style={{ fontSize: '12px', color: '#9ba3b8', lineHeight: 1.6, marginBottom: '12px' }}>{ai.description}</p>
              <div style={{ background: `${ai.color}11`, borderRadius: '6px', padding: '8px 10px', marginBottom: '10px' }}>
                <div style={{ fontSize: '11px', color: ai.color, fontWeight: 700, marginBottom: '2px' }}>Expected Impact</div>
                <div style={{ fontSize: '11px', color: '#9ba3b8' }}>{ai.benefit}</div>
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                {Object.entries(ai.impacts).map(([k, v]) => (
                  <span key={k} style={{ fontSize: '10px', padding: '2px 7px', borderRadius: '4px', background: `${ai.color}18`, color: ai.color, border: `1px solid ${ai.color}30` }}>
                    {k.charAt(0).toUpperCase() + k.slice(1)} +{v}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      {selected.length === 2 && (
        <Card style={{ marginBottom: '24px' }} className="fade-in">
          <div style={{ fontSize: '14px', fontWeight: 700, marginBottom: '14px', color: '#a78bfa' }}>Combined Business Impact</div>
          {Object.entries(totalImpact()).map(([k, v]) => (
            <ProgressBar key={k} label={k.charAt(0).toUpperCase() + k.slice(1)} value={v} color="#a78bfa" animated />
          ))}
        </Card>
      )}
      <div style={{ textAlign: 'center' }}>
        <Btn onClick={() => selected.length === 2 && onNext(selected)} disabled={selected.length < 2} style={{ fontSize: '16px', padding: '14px 40px' }}>
          View Final Dashboard →
        </Btn>
      </div>
    </div>
  );
}

function FinalDashboard({ company, crisis, warMetrics, warActions, negScore, leadershipScore, aiInvestments, onReplay }) {
  const aiData = AI_INVESTMENTS.filter(a => aiInvestments.includes(a.id));
  const resilience = Math.round((warMetrics.inventory + warMetrics.speed) / 2);
  const costControl = Math.round(warMetrics.cost);
  const riskMgmt = Math.round((negScore + (warMetrics.inventory * 0.5)) / 1.5);
  const custSat = Math.round(warMetrics.satisfaction);
  const overall = Math.round((leadershipScore * 0.25) + (negScore * 0.2) + (resilience * 0.2) + (costControl * 0.15) + (riskMgmt * 0.1) + (custSat * 0.1));
  const grade = overall >= 85 ? 'A+' : overall >= 75 ? 'A' : overall >= 65 ? 'B' : overall >= 55 ? 'C' : overall >= 45 ? 'D' : 'F';
  const gradeColor = overall >= 75 ? '#34d399' : overall >= 55 ? '#fbbf24' : '#f87171';
  const scores = [
    { label: 'Leadership', value: leadershipScore, color: '#a78bfa', icon: '👔' },
    { label: 'Negotiation', value: negScore, color: '#22d3ee', icon: '🤝' },
    { label: 'Resilience', value: resilience, color: '#34d399', icon: '🛡️' },
    { label: 'Cost Control', value: costControl, color: '#4f8ef7', icon: '💰' },
    { label: 'Risk Mgmt', value: riskMgmt, color: '#f472b6', icon: '⚠️' },
    { label: 'Cust. Sat.', value: custSat, color: '#fb923c', icon: '⭐' },
  ];

  const worstScore = scores.reduce((min, s) => s.value < min.value ? s : min, scores[0]);
  const bestScore = scores.reduce((max, s) => s.value > max.value ? s : max, scores[0]);

  const feedbacks = {
    'A+': 'You navigated this crisis with exceptional strategic clarity. Your decisions balanced short-term recovery with long-term resilience — exactly what the best supply chain leaders do.',
    'A': 'Excellent performance under pressure. You made mostly sound decisions across all dimensions. A few refinements could have pushed you to elite level.',
    'B': 'Good instincts with some gaps. You handled the core crisis well but missed opportunities in negotiation or strategic investment.',
    'C': 'Average crisis management. Some good calls, but critical blind spots in either leadership, cost control, or customer focus held you back.',
    'D': 'Significant room for improvement. You may have prioritized the wrong variables or made reactive rather than strategic decisions.',
    'F': 'This crisis would have caused serious long-term damage. Key decisions consistently undermined recovery. Use this as a learning baseline.',
  };
  const expertRecs = [
    'Build a dual-sourcing policy for all critical components — never more than 60% from a single supplier.',
    'Maintain 30+ days of safety stock for your top 20% of SKUs by revenue impact.',
    'Run annual tabletop crisis simulations with your leadership team before the real thing hits.',
    'Invest in supplier financial health monitoring — most disruptions are foreseeable 60-90 days early.',
    'Pre-negotiate emergency capacity agreements with 2-3 backup logistics providers.',
  ];
  const lessons = [
    `The ${crisis.type} exposed your dependency on a concentrated supply network. Diversification is insurance.`,
    'Proactive customer communication preserves more revenue than reactive discounting.',
    'Negotiation leverage comes from preparation, not desperation — build supplier relationships before you need them.',
    `Your ${worstScore.label.toLowerCase()} score suggests this is your biggest development area as a leader.`,
    `AI investment in ${aiData[0]?.name || 'demand forecasting'} will pay back 3-5x in the next disruption cycle.`,
  ];

  return (
    <div style={{ maxWidth: '900px', margin: '0 auto', padding: '40px 20px' }}>
      <div style={{ textAlign: 'center', marginBottom: '36px' }} className="fade-in">
        <div style={{ fontSize: '14px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '2px', marginBottom: '10px' }}>Final Results</div>
        <h1 style={{ fontSize: '32px', fontWeight: 800, marginBottom: '4px' }}>Operation Lifeline Complete</h1>
        <p style={{ color: '#9ba3b8' }}>{company.name} Corp · {crisis.type} · Crisis Resolved</p>
      </div>

      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '32px' }} className="count-up">
        <div style={{ textAlign: 'center', background: `${gradeColor}11`, border: `2px solid ${gradeColor}44`, borderRadius: '20px', padding: '32px 60px' }}>
          <div style={{ fontSize: '14px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Overall Crisis Score</div>
          <div style={{ fontSize: '80px', fontWeight: 900, color: gradeColor, lineHeight: 1, marginBottom: '8px' }}>{overall}</div>
          <div style={{ fontSize: '32px', fontWeight: 700, color: gradeColor }}>{grade}</div>
          <div style={{ fontSize: '14px', color: '#9ba3b8', marginTop: '8px' }}>{overall >= 75 ? 'Crisis Contained' : overall >= 55 ? 'Partial Recovery' : 'Significant Damage'}</div>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '10px', marginBottom: '24px' }} className="fade-in">
        {scores.map(s => (
          <Card key={s.label} style={{ textAlign: 'center', padding: '14px 10px' }}>
            <div style={{ fontSize: '18px', marginBottom: '6px' }}>{s.icon}</div>
            <div style={{ fontSize: '10px', color: '#5c647a', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '4px' }}>{s.label}</div>
            <div style={{ fontSize: '22px', fontWeight: 700, color: s.value >= 65 ? '#34d399' : s.value >= 45 ? '#fbbf24' : '#f87171' }}>{Math.round(s.value)}</div>
          </Card>
        ))}
      </div>

      <Card style={{ marginBottom: '16px' }} className="fade-in">
        <div style={{ fontSize: '13px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', color: '#9ba3b8', marginBottom: '14px' }}>Performance Breakdown</div>
        {scores.map(s => <ProgressBar key={s.label} label={s.label} value={s.value} color={s.value >= 65 ? '#34d399' : s.value >= 45 ? '#fbbf24' : '#f87171'} animated />)}
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px', marginBottom: '14px' }} className="fade-in">
        <Card style={{ borderColor: '#f87171' + '44' }}>
          <div style={{ fontSize: '11px', color: '#f87171', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px' }}>⚠️ Biggest Weakness</div>
          <div style={{ fontWeight: 700, marginBottom: '4px' }}>{worstScore.icon} {worstScore.label}</div>
          <div style={{ fontSize: '13px', color: '#9ba3b8', lineHeight: 1.6 }}>Score: {Math.round(worstScore.value)}/100. This area had the most room for improvement in your playthrough.</div>
        </Card>
        <Card style={{ borderColor: '#34d399' + '44' }}>
          <div style={{ fontSize: '11px', color: '#34d399', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px' }}>🏆 Biggest Strength</div>
          <div style={{ fontWeight: 700, marginBottom: '4px' }}>{bestScore.icon} {bestScore.label}</div>
          <div style={{ fontSize: '13px', color: '#9ba3b8', lineHeight: 1.6 }}>Score: {Math.round(bestScore.value)}/100. Your best dimension — this is where you showed natural leadership instinct.</div>
        </Card>
      </div>

      <Card style={{ marginBottom: '14px' }} className="fade-in">
        <div style={{ fontSize: '11px', color: '#a78bfa', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '10px' }}>👔 Personalized Feedback</div>
        <p style={{ fontSize: '14px', color: '#c8cad6', lineHeight: 1.8 }}>{feedbacks[grade]}</p>
      </Card>

      <Card style={{ marginBottom: '14px' }} className="fade-in">
        <div style={{ fontSize: '11px', color: '#22d3ee', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '12px' }}>🤖 Your AI Investments</div>
        <div style={{ display: 'grid', gap: '10px' }}>
          {aiData.map(ai => (
            <div key={ai.id} style={{ display: 'flex', gap: '12px', alignItems: 'flex-start', background: `${ai.color}0d`, border: `1px solid ${ai.color}22`, borderRadius: '8px', padding: '12px' }}>
              <span style={{ fontSize: '20px' }}>{ai.icon}</span>
              <div>
                <div style={{ fontWeight: 600, fontSize: '13px', color: ai.color, marginBottom: '2px' }}>{ai.name}</div>
                <div style={{ fontSize: '12px', color: '#9ba3b8' }}>{ai.benefit}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <Card style={{ marginBottom: '14px' }} className="fade-in">
        <div style={{ fontSize: '11px', color: '#fbbf24', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '12px' }}>💡 Expert Recommendations</div>
        {expertRecs.slice(0, 3).map((rec, i) => (
          <div key={i} style={{ display: 'flex', gap: '10px', marginBottom: '10px' }}>
            <div style={{ width: '20px', height: '20px', borderRadius: '50%', background: 'rgba(251,191,36,0.15)', border: '1px solid rgba(251,191,36,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '10px', color: '#fbbf24', fontWeight: 700, flexShrink: 0 }}>{i + 1}</div>
            <p style={{ fontSize: '13px', color: '#9ba3b8', lineHeight: 1.6, margin: 0 }}>{rec}</p>
          </div>
        ))}
      </Card>

      <Card style={{ marginBottom: '36px' }} className="fade-in">
        <div style={{ fontSize: '11px', color: '#34d399', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '12px' }}>📚 Lessons Learned</div>
        {lessons.map((l, i) => (
          <div key={i} style={{ display: 'flex', gap: '10px', marginBottom: '10px' }}>
            <span style={{ color: '#34d399', fontSize: '14px', flexShrink: 0 }}>→</span>
            <p style={{ fontSize: '13px', color: '#9ba3b8', lineHeight: 1.6, margin: 0 }}>{l}</p>
          </div>
        ))}
      </Card>

      <div style={{ textAlign: 'center' }}>
        <Btn onClick={onReplay} variant="secondary" style={{ fontSize: '16px', padding: '14px 40px', marginRight: '12px' }}>
          🔄 Play Again (New Crisis)
        </Btn>
        <p style={{ marginTop: '16px', fontSize: '12px', color: '#3a4055' }}>Every replay generates a different company, crisis, and outcome</p>
      </div>
    </div>
  );
}

// ---- App Shell ----

function App() {
  const [screen, setScreen] = useState('welcome');
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warMetrics, setWarMetrics] = useState(null);
  const [warActions, setWarActions] = useState([]);
  const [negScore, setNegScore] = useState(0);
  const [leadershipScore, setLeadershipScore] = useState(0);
  const [aiInvestments, setAiInvestments] = useState([]);

  const startGame = () => {
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setScreen('company');
  };

  const replay = () => {
    setCompany(null); setCrisis(null); setWarMetrics(null); setWarActions([]);
    setNegScore(0); setLeadershipScore(0); setAiInvestments([]);
    setScreen('welcome');
  };

  const steps = ['welcome', 'company', 'crisis', 'warroom', 'negotiation', 'ceo', 'ai', 'final'];
  const stepIdx = steps.indexOf(screen);

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      {screen !== 'welcome' && screen !== 'final' && (
        <div style={{ position: 'sticky', top: 0, zIndex: 100, background: 'rgba(10,13,18,0.9)', backdropFilter: 'blur(12px)', borderBottom: '1px solid rgba(255,255,255,0.06)', padding: '12px 20px' }}>
          <div style={{ maxWidth: '900px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ fontSize: '13px', fontWeight: 700, color: '#4f8ef7' }}>🌐 Operation Lifeline</div>
            <div style={{ display: 'flex', gap: '6px' }}>
              {['Company', 'Crisis', 'War Room', 'Negotiation', 'CEO', 'AI', 'Results'].map((s, i) => (
                <div key={s} style={{ width: '8px', height: '8px', borderRadius: '50%', background: i < stepIdx - 1 ? '#34d399' : i === stepIdx - 1 ? '#4f8ef7' : 'rgba(255,255,255,0.12)', transition: 'all 0.3s' }} title={s} />
              ))}
            </div>
            <button onClick={replay} style={{ background: 'none', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '6px', color: '#9ba3b8', fontSize: '12px', padding: '5px 12px', cursor: 'pointer' }}>↺ Restart</button>
          </div>
        </div>
      )}

      {screen === 'welcome' && <WelcomeScreen onStart={startGame} />}
      {screen === 'company' && <CompanyScreen company={company} onNext={() => setScreen('crisis')} />}
      {screen === 'crisis' && <CrisisScreen company={company} crisis={crisis} onNext={() => setScreen('warroom')} />}
      {screen === 'warroom' && <WarRoomScreen onNext={(metrics, actions) => { setWarMetrics(metrics); setWarActions(actions); setScreen('negotiation'); }} />}
      {screen === 'negotiation' && <NegotiationScreen onNext={(score) => { setNegScore(score); setScreen('ceo'); }} />}
      {screen === 'ceo' && <CEOScreen onNext={(score) => { setLeadershipScore(score); setScreen('ai'); }} />}
      {screen === 'ai' && <AIStrategyScreen onNext={(investments) => { setAiInvestments(investments); setScreen('final'); }} />}
      {screen === 'final' && warMetrics && (
        <FinalDashboard company={company} crisis={crisis} warMetrics={warMetrics} warActions={warActions}
          negScore={negScore} leadershipScore={leadershipScore} aiInvestments={aiInvestments} onReplay={replay} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
