<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#080e1c;
    --bg-grad:#0b1730;
    --panel:#0f1c37;
    --panel-2:#122544;
    --panel-3:#152a4d;
    --border:rgba(110,166,197,0.14);
    --border-strong:rgba(45,212,191,0.4);
    --teal:#2dd4bf;
    --teal-dim:#1c9c8f;
    --teal-glow:rgba(45,212,191,0.25);
    --amber:#f5b942;
    --red:#f4666b;
    --green:#3fdc9a;
    --text:#e9f0fb;
    --text-dim:#93a6c9;
    --text-faint:#5b6c8c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(45,212,191,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(245,185,66,0.07), transparent 40%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-grad) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--teal-glow);color:#fff;}

  .shell{
    max-width:900px;
    width:100%;
    margin:0 auto;
    padding:28px 20px 80px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    max-width:900px;
    margin:0 auto;
    width:100%;
    padding:20px 20px 0;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    letter-spacing:0.3px;
    font-size:15px;
    color:var(--text);
  }
  .brandmark .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 10px var(--teal-glow);
  }
  .brandmark small{
    color:var(--text-faint);
    font-weight:600;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-left:4px;
  }

  /* ---- Stepper / Compass ---- */
  .stepper-wrap{
    display:flex;
    align-items:center;
    gap:18px;
    margin:22px 0 6px;
  }
  .compass{flex-shrink:0;}
  .stepper-info{flex:1;min-width:0;}
  .stepper-stage{
    font-size:11px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:700;
    margin-bottom:4px;
  }
  .stepper-track{
    display:flex;
    gap:5px;
  }
  .stepper-seg{
    height:4px;
    flex:1;
    border-radius:3px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .stepper-seg i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--teal-dim),var(--teal));
    transition:width .5s ease;
  }
  .stepper-labels{
    display:flex;justify-content:space-between;
    margin-top:6px;
    font-size:10px;
    color:var(--text-faint);
  }
  .stepper-labels span{display:none;}
  @media(min-width:620px){ .stepper-labels span{display:block;} }

  /* ---- Cards ---- */
  .card{
    background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 26px;
    margin-bottom:18px;
    animation:fadeSlideIn .45s ease both;
  }
  @keyframes fadeSlideIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .screen{animation:fadeSlideIn .4s ease both;}

  .eyebrow{
    font-size:11px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin:0 0 8px;
  }
  h1{font-size:30px;line-height:1.15;margin:0 0 12px;font-weight:800;letter-spacing:-0.3px;}
  h2{font-size:22px;line-height:1.25;margin:0 0 10px;font-weight:800;letter-spacing:-0.2px;}
  h3{font-size:16px;margin:0 0 6px;font-weight:700;}
  p{color:var(--text-dim);line-height:1.65;font-size:15px;margin:0 0 12px;}
  .lead{font-size:16.5px;color:var(--text);}

  .explain-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:16px 0;
  }
  @media(max-width:640px){ .explain-grid{grid-template-columns:1fr;} }
  .explain-box{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
  }
  .explain-box .tag{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
    display:inline-block;
    margin-bottom:8px;
  }
  .explain-box.what .tag{color:var(--teal);}
  .explain-box.why .tag{color:var(--amber);}
  .explain-box p{margin:0;font-size:14px;}

  /* ---- Buttons ---- */
  .btn{
    appearance:none;
    border:1px solid var(--border-strong);
    background:rgba(45,212,191,0.08);
    color:var(--text);
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    padding:13px 22px;
    border-radius:11px;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn:hover{background:rgba(45,212,191,0.16); transform:translateY(-1px); box-shadow:0 6px 18px rgba(45,212,191,0.12);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.primary{
    background:linear-gradient(135deg,var(--teal),var(--teal-dim));
    border-color:transparent;
    color:#04211d;
  }
  .btn.primary:hover{box-shadow:0 8px 24px rgba(45,212,191,0.32);}
  .btn.ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--text-dim);
  }
  .btn.ghost:hover{color:var(--text);border-color:var(--border-strong);background:rgba(255,255,255,0.04);}
  .btn.small{padding:8px 14px;font-size:13px;border-radius:9px;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;justify-content:space-between;}
  .btn-row .left-group, .btn-row .right-group{display:flex;gap:12px;flex-wrap:wrap;}

  /* ---- Path choice cards ---- */
  .path-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px;}
  .path-card{
    text-align:left;
    background:rgba(255,255,255,0.025);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    transition:all .2s ease;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .path-card:hover{border-color:var(--border-strong);background:rgba(45,212,191,0.06);transform:translateY(-2px);}
  .path-card .emoji{font-size:28px;line-height:1;}
  .path-card h3{margin-bottom:4px;}
  .path-card p{margin:0;font-size:13.5px;}

  /* ---- Forms ---- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:700;
    color:var(--text-dim);margin-bottom:6px;
    letter-spacing:0.3px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-family:inherit;
    font-size:14.5px;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--teal);
    background:rgba(45,212,191,0.05);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){ .field-row{grid-template-columns:1fr;} }
  .autofill-link{
    background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:700;
    cursor:pointer;padding:0;margin-bottom:16px;text-decoration:underline;text-underline-offset:3px;
  }

  /* ---- Reveal / brand recap cards ---- */
  .recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
  @media(max-width:640px){ .recap-grid{grid-template-columns:1fr;} }
  .recap-item{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:11px;
    padding:13px 15px;
  }
  .recap-item .k{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:4px;}
  .recap-item .v{font-size:14px;color:var(--text);line-height:1.5;}

  /* ---- Selectable option cards (platforms/pillars) ---- */
  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
  @media(max-width:640px){ .option-grid{grid-template-columns:1fr;} }
  .option-card{
    text-align:left;
    background:rgba(255,255,255,0.025);
    border:1.5px solid var(--border);
    border-radius:13px;
    padding:16px 16px;
    cursor:pointer;
    transition:all .18s ease;
    position:relative;
  }
  .option-card:hover{border-color:rgba(45,212,191,0.4);background:rgba(45,212,191,0.05);}
  .option-card.selected{border-color:var(--teal);background:rgba(45,212,191,0.1);box-shadow:0 0 0 1px var(--teal) inset;}
  .option-card.disabled{opacity:0.4;cursor:not-allowed;}
  .option-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .option-card .emoji{font-size:22px;}
  .option-card h3{margin:0;font-size:15px;}
  .option-card p{font-size:13px;margin:0;}
  .check-mark{
    width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:12px;color:transparent;
    transition:all .2s ease;
  }
  .option-card.selected .check-mark{background:var(--teal);color:#04211d;border-color:var(--teal);}

  .fit-badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;
    margin-top:2px;
  }
  .fit-badge.High{background:rgba(63,220,154,0.15);color:var(--green);}
  .fit-badge.Medium{background:rgba(245,185,66,0.15);color:var(--amber);}
  .fit-badge.Low{background:rgba(244,102,107,0.15);color:var(--red);}

  .goal-badge{
    display:inline-block;
    font-size:10px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;
    background:rgba(45,212,191,0.12);color:var(--teal);
    margin-bottom:6px;
  }

  .counter-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;font-weight:700;color:var(--text-dim);
  }
  .counter-pill b{color:var(--teal);}

  /* ---- Roadmap ---- */
  .roadmap{position:relative;margin:18px 0 6px;padding-left:26px;}
  .roadmap::before{
    content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--teal),rgba(45,212,191,0.05));
    border-radius:2px;
  }
  .week{position:relative;margin-bottom:22px;}
  .week:last-child{margin-bottom:0;}
  .week::before{
    content:'';position:absolute;left:-26px;top:4px;width:14px;height:14px;border-radius:50%;
    background:var(--bg);border:2.5px solid var(--teal);
  }
  .week .wk-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .week .wk-num{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--teal);text-transform:uppercase;}
  .week .wk-goal{font-size:16px;font-weight:800;}
  .week .wk-bar{height:5px;border-radius:4px;background:rgba(255,255,255,0.07);overflow:hidden;margin:8px 0 10px;max-width:260px;}
  .week .wk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-dim),var(--teal));}
  .week ul{margin:0;padding-left:18px;}
  .week li{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:4px;}

  /* ---- Event scenario ---- */
  .scenario-box{
    background:linear-gradient(135deg, rgba(245,185,66,0.08), rgba(45,212,191,0.04));
    border:1px solid rgba(245,185,66,0.25);
    border-radius:14px;
    padding:20px;
    margin:14px 0 20px;
  }
  .scenario-box .flag{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
  .event-options{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .event-opt{
    text-align:left;background:rgba(255,255,255,0.03);
    border:1.5px solid var(--border);border-radius:12px;
    padding:14px 16px;cursor:pointer;transition:all .18s ease;
    font-size:14.5px;color:var(--text);font-weight:600;font-family:inherit;
  }
  .event-opt:hover{border-color:var(--border-strong);background:rgba(45,212,191,0.06);}
  .event-opt:disabled{cursor:default;}
  .event-opt.chosen{border-color:var(--teal);background:rgba(45,212,191,0.1);}
  .event-opt.faded{opacity:0.45;}
  .consequence-box{
    margin-top:16px;border-radius:13px;padding:17px 18px;
    animation:fadeSlideIn .4s ease both;
    border:1px solid;
  }
  .consequence-box.good{background:rgba(63,220,154,0.08);border-color:rgba(63,220,154,0.35);}
  .consequence-box.neutral{background:rgba(245,185,66,0.08);border-color:rgba(245,185,66,0.35);}
  .consequence-box.risky{background:rgba(244,102,107,0.08);border-color:rgba(244,102,107,0.35);}
  .consequence-box .clabel{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
  .consequence-box.good .clabel{color:var(--green);}
  .consequence-box.neutral .clabel{color:var(--amber);}
  .consequence-box.risky .clabel{color:var(--red);}
  .consequence-box p{margin:0 0 8px;color:var(--text);font-size:14.5px;}
  .consequence-box .lesson-line{font-size:13px;color:var(--text-dim);font-style:italic;margin:0;}

  /* ---- Ask Claude Card ---- */
  .ask-claude{
    background:#060b17;
    border:1px solid rgba(45,212,191,0.22);
    border-radius:14px;
    padding:18px 20px;
    margin-top:6px;
    position:relative;
  }
  .ask-claude .ac-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ask-claude .ac-icon{
    width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg,var(--teal),var(--teal-dim));
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#04211d;flex-shrink:0;
  }
  .ask-claude .ac-title{font-size:12.5px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--teal);}
  .ask-claude .ac-prompt{
    font-family:'SF Mono',Consolas,Monaco,monospace;
    font-size:13px;
    line-height:1.65;
    color:var(--text-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 14px;
    white-space:pre-wrap;
    margin-bottom:10px;
  }
  .ask-claude .ac-copy{
    background:rgba(45,212,191,0.1);border:1px solid var(--border-strong);
    color:var(--teal);font-weight:700;font-size:12.5px;
    padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .ask-claude .ac-copy:hover{background:rgba(45,212,191,0.18);}
  .ask-claude .ac-note{font-size:12px;color:var(--text-faint);margin-top:8px;margin-bottom:0;}

  /* ---- Report ---- */
  .score-hero{
    display:flex;align-items:center;gap:24px;
    flex-wrap:wrap;
    padding-bottom:6px;
  }
  .score-ring-wrap{flex-shrink:0;}
  .score-hero-text{flex:1;min-width:200px;}
  .report-section{margin-bottom:20px;}
  .report-section:last-child{margin-bottom:0;}
  .report-section .rs-label{
    font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--teal);margin-bottom:8px;
  }
  .decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){ .decision-grid{grid-template-columns:1fr;} }
  .decision-box{border-radius:13px;padding:16px 17px;border:1px solid;}
  .decision-box.best{background:rgba(63,220,154,0.07);border-color:rgba(63,220,154,0.3);}
  .decision-box.mistake{background:rgba(244,102,107,0.07);border-color:rgba(244,102,107,0.3);}
  .decision-box .dlabel{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .decision-box.best .dlabel{color:var(--green);}
  .decision-box.mistake .dlabel{color:var(--red);}
  .decision-box p{margin:0;color:var(--text);font-size:14px;}
  .lessons-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .lessons-list li{
    display:flex;gap:12px;align-items:flex-start;
    background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:11px;padding:12px 14px;font-size:14px;color:var(--text);line-height:1.55;
  }
  .lessons-list .lnum{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;
    background:rgba(45,212,191,0.15);color:var(--teal);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }

  /* ---- Welcome ---- */
  .welcome-hero{text-align:left;padding:6px 0 4px;}
  .welcome-badges{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px;}
  .wbadge{
    background:rgba(255,255,255,0.04);border:1px solid var(--border);
    border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--text-dim);font-weight:600;
  }

  footer.appfooter{
    text-align:center;color:var(--text-faint);font-size:12px;padding:20px 20px 30px;
  }

  @media(max-width:480px){
    h1{font-size:24px;}
    h2{font-size:19px;}
    .card{padding:20px 18px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

/* =========================================================
   DATA
========================================================= */

const INDUSTRIES = [
  {id:'fashion', label:'Fashion & Apparel Brand', tags:{visual:true,consumer:true,ecommerce:true},
    names:['Lumen & Thread','Northfield Apparel','Marrow Studio'],
    audience:'Style-conscious 20-35 year olds who shop online and follow fashion trends on social media',
    competitors:['Everline Co.','Rovewear']},
  {id:'food', label:'Café & Food Business', tags:{visual:true,local:true,consumer:true},
    names:['The Copper Cup','Bramblewood Kitchen','Sunday Loaf Bakery'],
    audience:'Local residents and remote workers aged 22-45 looking for a cozy place to eat, work, or meet friends',
    competitors:['Daily Grind Coffee','Harvest & Co.']},
  {id:'fitness', label:'Fitness Studio', tags:{visual:true,local:true,consumer:true,community:true},
    names:['Ironwell Studio','Pulse Fitness Collective','Basecamp Training'],
    audience:'Busy professionals aged 25-45 who want structured workouts and a supportive community',
    competitors:['FormFit Gym','CityMotion Studio']},
  {id:'saas', label:'Tech / SaaS Startup', tags:{b2b:true,professional:true,digital:true},
    names:['Flowbase','Ledgerly','Northpoint Analytics'],
    audience:'Small business owners and operations managers who need to save time on repetitive admin work',
    competitors:['TaskGrid','OpsHero']},
  {id:'beauty', label:'Skincare & Beauty Brand', tags:{visual:true,consumer:true,ecommerce:true},
    names:['Aster & Bloom','Quiet Skin Co.','Terra Glow'],
    audience:'Skincare enthusiasts aged 20-40 who research ingredients carefully before buying',
    competitors:['Bare Ritual','Glasswing Skin']},
  {id:'home', label:'Home Décor & Furniture', tags:{visual:true,consumer:true,ecommerce:true},
    names:['Fernwood Home','Amble & Oak','Studio Linden'],

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){
  const copy = [...arr];
  const out = [];
  while(out.length < n && copy.length){
    out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  }
  return out;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function computeFitScore(platformId, brand){
  const t = brand.tags || {};
  const isPersonal = brand.type === 'personal';
  let s = 0;
  switch(platformId){
    case 'instagram':
      if(t.visual) s+=2; if(t.consumer) s+=1; if(t.b2b) s-=1; break;
    case 'tiktok':
      if(t.visual) s+=2; if(t.consumer) s+=1; if(t.b2b) s-=2; if(isPersonal && t.community) s+=1; break;
    case 'facebook':
      if(t.local) s+=2; if(t.consumer) s+=1; if(t.cause) s+=1; if(isPersonal) s-=1; break;
    case 'linkedin':
      if(t.b2b) s+=2; if(t.professional) s+=2; if(isPersonal) s+=2; if(t.visual && !t.professional) s-=1; break;
    case 'twitter':
      if(t.professional) s+=1; if(t.digital) s+=1; if(isPersonal) s+=2; break;
    case 'youtube':
      if(t.education) s+=2; if(t.visual) s+=1; if(isPersonal) s+=2; break;
    case 'pinterest':
      if(t.visual) s+=2; if(t.ecommerce) s+=2; if(t.b2b) s-=2; if(isPersonal) s-=1; break;
    case 'newsletter':
      s+=1; if(t.education) s+=1; if(isPersonal) s+=2; break;
    default: s=0;
  }
  return s;
}

function fitRating(score){
  if(score >= 3) return 'High';
  if(score >= 1) return 'Medium';
  return 'Low';
}

function fitReason(platformId, rating, brand){
  const core = PLATFORM_CORE[platformId];
  const isPersonal = brand.type === 'personal';
  const weighted = isPersonal && ['linkedin','twitter','youtube','newsletter'].indexOf(platformId) !== -1;
  let base;
  if(rating === 'High'){
    base = `${brand.displayName}'s goals line up well with ${core} — this should be a core channel.`;
  } else if(rating === 'Medium'){
    base = `${core} can support the strategy, but it shouldn't be the main focus for ${brand.displayName} right now.`;
  } else {
    base = `${core} doesn't closely match ${brand.displayName}'s current audience or goals — not worth the effort as a primary channel.`;
  }
  if(weighted && rating !== 'Low'){
    base += ' Personal brands typically get outsized traction here.';
  }
  return base;
}

function weightForRating(r){ return r === 'High' ? 2 : r === 'Medium' ? 1 : 0; }

function CompassRing({progress, size=54}){
  const r = (size/2) - 5;
  const c = 2*Math.PI*r;
  const offset = c - (progress/100)*c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="4"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="url(#ringGrad)" strokeWidth="4"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{transition:'stroke-dashoffset .6s ease'}} />
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#2dd4bf"/>
          <stop offset="100%" stopColor="#f5b942"/>
        </linearGradient>
      </defs>
      <text x="50%" y="53%" textAnchor="middle" fill="#e9f0fb" fontSize="13" fontWeight="800" fontFamily="Inter">
        {Math.round(progress)}%
      </text>
    </svg>
  );
}

function ScoreGauge({score, size=110}){
  const r = (size/2) - 8;
  const c = 2*Math.PI*r;
  const offset = c - (score/100)*c;
  let color = '#3fdc9a';
  if(score < 45) color = '#f4666b'; else if(score < 70) color = '#f5b942';
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="9"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="9"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{transition:'stroke-dashoffset .8s ease'}} />
      <text x="50%" y="47%" textAnchor="middle" fill="#e9f0fb" fontSize="26" fontWeight="800" fontFamily="Inter">{score}</text>
      <text x="50%" y="65%" textAnchor="middle" fill="#93a6c9" fontSize="10" fontWeight="700" fontFamily="Inter" letterSpacing="1">GROWTH</text>
    </svg>
  );
}

function AskClaudeCard({prompt, note}){
  const [copied, setCopied] = useState(false);
  function doCopy(){
    const finish = () => { setCopied(true); setTimeout(()=>setCopied(false), 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(finish).catch(()=>{
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
    function fallbackCopy(){
      const ta = document.createElement('textarea');
      ta.value = prompt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      finish();
    }
  }
  return (
    <div className="ask-claude">
      <div className="ac-head">
        <div className="ac-icon">✦</div>
        <div className="ac-title">How to ask Claude</div>
      </div>
      <div className="ac-prompt">{prompt}</div>
      <button className="ac-copy" onClick={doCopy}>{copied ? '✓ Copied' : '⧉ Copy prompt'}</button>
      {note && <p className="ac-note">{note}</p>}
    </div>
  );
}

function PlatformScreen({brand, selected, setSelected, onNext}){
  const isPersonal = brand.type === 'personal';
  const fits = useMemo(()=>PLATFORMS.map(p=>{
    const score = computeFitScore(p.id, brand);
    const rating = fitRating(score);
    return {...p, rating, reason: fitReason(p.id, rating, brand)};
  }), [brand]);

  function toggle(id){
    setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }

  const prompt = isPersonal
    ? `I'm building a personal brand as ${brand.displayName} in ${brand.nicheLabel}. Which 2-3 social platforms should I focus on first, and why? Be specific about tradeoffs.`
    : `My business ${brand.displayName} is a ${brand.industryLabel.toLowerCase()} targeting: ${brand.audience}\nWhich 2-3 social platforms should I focus on first, and why? Be specific about tradeoffs.`;

  return (
    <div className="screen">
      <div className="card">
        <div className="eyebrow">Step 4 · Choose the platforms</div>

        <WhatWhy
          what="Every platform rewards a different type of content and reaches a different kind of audience."
          why={isPersonal
            ? "Being everywhere with a personal brand usually means being thin everywhere. Personal brands tend to grow fastest on platforms built around a voice and a point of view — LinkedIn, X/Twitter, YouTube, and newsletters — rather than purely visual ones."
            : "Trying to be everywhere spreads a team thin and dilutes the message. The best strategists pick a small number of channels where the audience already spends time, and go deep there."}
        />
        <p style={{fontSize:13.5}}>Tap the platforms you'd choose. Fit ratings are shown for every option so you can see the reasoning either way.</p>
        <div className="option-grid">
          {fits.map(p=>(
            <button key={p.id} className={"option-card" + (selected.includes(p.id) ? " selected":"")} onClick={()=>toggle(p.id)}>
              <div className="top-row">
                <div>
                  <span className="emoji">{p.emoji}</span>
                </div>
                <div className="check-mark">{selected.includes(p.id) ? '✓':''}</div>
              </div>

              <span className={"fit-badge " + p.rating}>{p.rating} Fit</span>

        </div>
        <div className="btn-row">
          <div className="left-group">
            <span className="counter-pill"><b>{selected.length}</b> platform{selected.length!==1?'s':''} selected</span>

            <button className="btn primary" disabled={selected.length===0} onClick={onNext}>Continue →</button>
          </div>
        </div>

  );

function PillarScreen({brand, pillars, selected, setSelected, onNext}){
  const isPersonal = brand.type === 'personal';
  function toggle(id){
    setSelected(prev=>{
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length>=3) return prev;
      return [...prev, id];
    });
  }
  const prompt = isPersonal
    ? `I'm ${brand.displayName}, building a personal brand in ${brand.nicheLabel}. I'm choosing 3 content pillars from: ${pillars.map(p=>p.label).join(', ')}. Which 3 would you recommend for someone starting out, and why those three together?`
    : `My business ${brand.displayName} (${brand.industryLabel.toLowerCase()}) is choosing 3 content pillars from: ${pillars.map(p=>p.label).join(', ')}. Which 3 would you recommend, and why those three together?`;

  return (
    <div className="screen">
      <div className="card">
        <div className="eyebrow">Step 5 · Build content pillars</div>
        <h2>Pick exactly 3 content pillars</h2>
        <WhatWhy
          what="Content pillars are the recurring themes a brand or person posts about — the categories that repeat, week after week."

                <div className="top-row">
                  <div className="goal-badge">{p.goal}</div>
                  <div className="check-mark">{isSel ? '✓':''}</div>

          <div className="left-group">
            <span className="counter-pill"><b>{selected.length}</b> / 3 selected</span>

          <div className="right-group">
            <button className="btn primary" disabled={selected.length!==3} onClick={onNext}>Continue →</button>

      <AskClaudeCard prompt={prompt} />
    </div>

function buildRoadmap(brand, platforms, pillars){
  const isPersonal = brand.type === 'personal';
  const platformNames = platforms.map(id=>PLATFORMS.find(p=>p.id===id).label).join(', ');
  const pillarNames = pillars.map(p=>p.label).join(', ');

  if(isPersonal){
    return [
      {num:1, goal:'Define Your POV & Optimize Your Profile', pct:25, items:[
        `Write a one-line positioning statement: what you help people with in ${brand.nicheLabel.toLowerCase()}, and how you're different.`,
        `Optimize your bio and profile on ${platformNames} so a stranger understands your niche in 5 seconds.`,
        'Draft 2-3 core talking points you want to be known for.',
      ]},
      {num:2, goal:'Publish Consistently & Get Seen', pct:50, items:[
        `Post regularly across ${pillarNames}, mixing formats to see what resonates.`,
        'Engage daily in communities and comment sections where your audience already hangs out.',
        'Track which posts get replies, not just likes — replies signal real connection.',
      ]},
      {num:3, goal:'Deepen Trust & Authority', pct:75, items:[
        'Share a bigger, more vulnerable personal story or a hard-won lesson.',
        'Start real conversations — reply to DMs and comments like a person, not a broadcast.',
        'Look for a collab, guest spot, or cross-post opportunity with someone adjacent to your niche.',
      ]},
      {num:4, goal:'Analyze & Convert Attention', pct:100, items:[
        'Review what actually grew your audience this month and double down on it.',
        'Introduce a low-pressure next step for engaged followers — a newsletter signup or a call.',
        'Set one clear focus for next month based on what worked.',
      ]},
    ];
  }
  return [
    {num:1, goal:'Foundation', pct:25, items:[
      `Finalize positioning for ${brand.displayName} and confirm ${platformNames} as the core channels.`,
      'Set up or clean up profiles so anyone landing on them immediately understands the brand.',
      'Review competitors for gaps worth filling.',
    ]},
    {num:2, goal:'Build Awareness', pct:50, items:[
      `Publish a steady mix across ${pillarNames} to introduce the brand to new people.`,
      'Engage with comments and relevant conversations daily, not just post-and-leave.',
      'Track early metrics: reach, saves, and shares matter more than vanity likes right now.',
    ]},
    {num:3, goal:'Build Trust & Community', pct:75, items:[
      'Feature real customer stories or testimonials to build social proof.',
      'Show behind-the-scenes content that makes the brand feel human.',
      'Respond to every comment and message — community grows from attention, not just content.',
    ]},
    {num:4, goal:'Convert & Optimize', pct:100, items:[
      'Introduce a clear call-to-action tied to the biggest challenge the brand is facing.',
      'Review the month\'s data and double down on whatever performed best.',
      'Cut or adjust whatever consistently underperformed.',
    ]},
  ];
}

          <div className={"consequence-box " + chosenOpt.quality}>
            <div className="clabel">
              {chosenOpt.quality==='good' ? '✓ What happens next' : chosenOpt.quality==='neutral' ? '~ What happens next' : '✕ What happens next'}
            </div>
            <p>{chosenOpt.consequence}</p>
            <p className="lesson-line">Lesson: {chosenOpt.lesson}</p>
          </div>
        )}
        <div className="btn-row">
          <div className="left-group"><button className="btn primary" disabled={!choice} onClick={onNext}>See the Growth Report →</button></div>
        </div>
      </div>
      <AskClaudeCard prompt={prompt} />
    </div>
  );
}

function buildReport(brand, platformIds, pillarIds, pillarPool, focusId, event, choiceId){
  const isPersonal = brand.type === 'personal';
  const fits = platformIds.map(id=>{
    const score = computeFitScore(id, brand);
    const rating = fitRating(score);
    return {id, label:PLATFORMS.find(p=>p.id===id).label, rating};
  });
  const avgWeight = fits.length ? fits.reduce((a,f)=>a+weightForRating(f.rating),0)/fits.length : 1;
  const bestPlatform = fits.slice().sort((a,b)=>weightForRating(b.rating)-weightForRating(a.rating))[0];
  const worstPlatform = fits.slice().sort((a,b)=>weightForRating(a.rating)-weightForRating(b.rating))[0];

  const chosenPillars = pillarIds.map(id=>pillarPool.find(p=>p.id===id));
  const uniqueGoals = new Set(chosenPillars.map(p=>p.goal));
  const diversity = uniqueGoals.size;

  const chosenOpt = event.options.find(o=>o.id===choiceId);
  const eventQuality = chosenOpt.quality;

  let score = 50;
  score += (avgWeight - 1) * 15;
  score += diversity >= 2 ? 10 : -5;
  score += eventQuality === 'good' ? 15 : eventQuality === 'neutral' ? 0 : -15;
  score = Math.round(clamp(score, 8, 97));

  // Best decision
  let bestDecision;
  if(eventQuality === 'good'){
    bestDecision = `Choosing to "${chosenOpt.label.toLowerCase()}" when things got unpredictable. ${chosenOpt.consequence}`;
  } else if(bestPlatform && bestPlatform.rating === 'High'){
    bestDecision = `Prioritizing ${bestPlatform.label} as a core channel — it's a strong match for ${isPersonal ? "your niche and voice" : "this audience and industry"}.`;
  } else if(diversity >= 2){
    bestDecision = `Choosing pillars that cover different goals (${Array.from(uniqueGoals).join(', ')}) instead of three that overlap.`;
  } else {
    bestDecision = `Taking the time to define ${isPersonal ? "a clear point of view" : "a specific audience"} before jumping into content — that groundwork pays off in every decision after it.`;
  }

  // Biggest mistake / growth opportunity
  let biggestMistake;
  if(eventQuality === 'risky'){
    biggestMistake = `Choosing to "${chosenOpt.label.toLowerCase()}" during the curveball moment. ${chosenOpt.consequence}`;
  } else if(worstPlatform && worstPlatform.rating === 'Low'){
    biggestMistake = `Including ${worstPlatform.label} despite it being a weaker fit for ${isPersonal ? "this niche" : "this audience"} — that effort would likely go further elsewhere.`;
  } else if(diversity < 2){
    biggestMistake = `The three pillars chosen (${chosenPillars.map(p=>p.label).join(', ')}) lean on similar goals — a bit more variety would cover more of the funnel.`;
  } else {
    const unusedHigh = PLATFORMS.map(p=>({id:p.id,label:p.label,rating:fitRating(computeFitScore(p.id,brand))}))
      .filter(p=>p.rating==='High' && platformIds.indexOf(p.id)===-1)[0];
    biggestMistake = unusedHigh
      ? `${unusedHigh.label} was a strong fit but never got tested — an easy way to extend reach next round.`
      : `No major missteps here — the next challenge is simply staying consistent long enough for the strategy to compound.`;
  }

  const focusLabel = AUDIENCE_FOCUS_OPTIONS.find(o=>o.id===focusId).label.toLowerCase();
  const audienceUnderstanding = isPersonal
    ? `${brand.displayName}'s audience is drawn to ${focusLabel}. The story and expertise in ${brand.nicheLabel.toLowerCase()} give a specific way to deliver that.`
    : `${brand.displayName}'s audience responds most to ${focusLabel}. Every content and platform decision here was built around that driver.`;

  const platformStrategy = `Focused on ${fits.map(f=>`${f.label} (${f.rating} fit)`).join(', ')}. ${
    avgWeight >= 1.5 ? 'Strong overall alignment between the platforms chosen and this audience.' :
    avgWeight >= 0.8 ? 'A reasonable mix, though not every channel is a strong match.' :
    'Several channels here are a stretch for this audience — worth narrowing next time.'
  }`;

  const contentStrategy = `Built around ${chosenPillars.map(p=>p.label).join(', ')} — ${
    diversity >= 2 ? 'a mix that covers more than one goal, which keeps the content from feeling one-note.' : 'pillars that lean toward similar goals, which is fine for focus but worth diversifying over time.'
  }`;

  const generalPool = isPersonal ? GENERAL_LESSONS_PERSONAL : GENERAL_LESSONS_BIZ;
  const extra = pickN(generalPool, 2);
  const lessons = [chosenOpt.lesson, ...extra];

  return {score, bestDecision, biggestMistake, audienceUnderstanding, platformStrategy, contentStrategy, lessons, fits, chosenPillars};
}

function ReportScreen({brand, report, onRestart}){
  const isPersonal = brand.type === 'personal';
  const prompt = isPersonal
    ? `I just finished a strategy exercise for my personal brand, ${brand.displayName} in ${brand.nicheLabel}. Based on authenticity, consistency, and niche clarity, what's one thing I should focus on for the next 30 days?`
    : `I just finished a marketing strategy exercise for ${brand.displayName}, a ${brand.industryLabel.toLowerCase()}. Based on the plan so far, what's one thing I should focus on for the next 30 days?`;

  return (
    <div className="screen">
      <div className="card">
        <div className="eyebrow">Final Step · Growth Report</div>
        <div className="score-hero">
          <div className="score-ring-wrap"><ScoreGauge score={report.score} /></div>
          <div className="score-hero-text">
            <h2 style={{marginBottom:6}}>{brand.displayName}'s Growth Report</h2>
            <p style={{margin:0}}>
              {report.score >= 70 ? 'A well-aligned strategy with strong fundamentals in place.' :
               report.score >= 45 ? 'A workable strategy with a few clear areas to sharpen.' :
               'The foundation is there — a few key decisions are worth revisiting.'}
            </p>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="report-section">
          <div className="rs-label">Audience Understanding</div>
          <p style={{margin:0}}>{report.audienceUnderstanding}</p>
        </div>
        <div className="report-section">
          <div className="rs-label">Platform Strategy</div>
          <p style={{margin:0}}>{report.platformStrategy}</p>
        </div>
        <div className="report-section">
          <div className="rs-label">Content Strategy</div>
          <p style={{margin:0}}>{report.contentStrategy}</p>
        </div>
        <div className="report-section">
          <div className="rs-label">Growth Potential</div>
          <p style={{margin:0}}>Estimated at {report.score}/100 based on channel fit, content variety, and how the curveball moment was handled.</p>
        </div>
      </div>

      <div className="card">
        <div className="decision-grid">
          <div className="decision-box best">
            <div className="dlabel">✓ Best Decision</div>
            <p>{report.bestDecision}</p>
          </div>
          <div className="decision-box mistake">
            <div className="dlabel">⚠ Biggest Mistake</div>
            <p>{report.biggestMistake}</p>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="rs-label" style={{marginBottom:12}}>Three Marketing Lessons</div>
        <ul className="lessons-list">
          {report.lessons.map((l,i)=>(
            <li key={i}><span className="lnum">{i+1}</span><span>{l}</span></li>
          ))}
        </ul>
      </div>

      <AskClaudeCard prompt={prompt} note="Bring this into a real chat with Claude to keep building on what you learned here." />

      <div className="card" style={{textAlign:'center'}}>
        <h3 style={{marginBottom:6}}>Ready for another round?</h3>
        <p>Try a different path, a different client, or a different set of decisions.</p>
        <div className="btn-row" style={{justifyContent:'center'}}>
          <button className="btn primary" onClick={onRestart}>🔁 Play Again</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   APP
========================================================= */

function App(){
  const [step, setStep] = useState('welcome');
  const [path, setPath] = useState(null);
  const [brand, setBrand] = useState(null);
  const [focus, setFocus] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [event, setEvent] = useState(null);
  const [eventChoice, setEventChoice] = useState(null);

  function resetAll(){
    setStep('welcome'); setPath(null); setBrand(null); setFocus(null);
    setPlatforms([]); setPillars([]); setEvent(null); setEventChoice(null);
  }

  function handleBrandReady(b){
    setBrand(b);
    setStep('audience');
  }

  function goRoadmapToEvent(){
    const pool = brand.type==='personal' ? personalEvents(brand) : bizEvents(brand);
    setEvent(pick(pool));
    setEventChoice(null);
    setStep('event');
  }

  const pillarPool = brand && brand.type==='personal' ? PERSONAL_PILLARS : BIZ_PILLARS;

  const stageIndex = (() => {
    switch(step){
      case 'setup': return 0;
      case 'audience': return 1;
      case 'platforms': return 2;
      case 'pillars': return 3;
      case 'roadmap': return 4;
      case 'event': return 5;
      case 'report': return 6;
      default: return 0;
    }
  })();

  let body = null;
  if(step === 'welcome'){
    body = <Welcome onStart={()=>setStep('path')} />;
  } else if(step === 'path'){
    body = <PathSelect onPick={(p)=>{ setPath(p); setStep('setup'); }} />;
  } else if(step === 'setup'){
    if(path === 'business') body = <BusinessForm onSubmit={handleBrandReady} />;
    else if(path === 'personal') body = <PersonalForm onSubmit={handleBrandReady} />;
    else body = <RandomReveal onConfirm={handleBrandReady} />;
  } else if(step === 'audience' && brand){
    body = <AudienceScreen brand={brand} focus={focus} setFocus={setFocus} onNext={()=>setStep('platforms')} />;
  } else if(step === 'platforms' && brand){
    body = <PlatformScreen brand={brand} selected={platforms} setSelected={setPlatforms} onNext={()=>setStep('pillars')} />;
  } else if(step === 'pillars' && brand){
    body = <PillarScreen brand={brand} pillars={pillarPool} selected={pillars} setSelected={setPillars} onNext={()=>setStep('roadmap')} />;
  } else if(step === 'roadmap' && brand){
    const chosenPillars = pillars.map(id=>pillarPool.find(p=>p.id===id));
    body = <RoadmapScreen brand={brand} platforms={platforms} pillars={chosenPillars} onNext={goRoadmapToEvent} />;
  } else if(step === 'event' && brand && event){
    body = <EventScreen brand={brand} event={event} choice={eventChoice} onChoose={setEventChoice}
      onNext={()=>setStep('report')} />;
  } else if(step === 'report' && brand && event && eventChoice){
    const report = buildReport(brand, platforms, pillars, pillarPool, focus, event, eventChoice);
    body = <ReportScreen brand={brand} report={report} onRestart={resetAll} />;
  } else {
    body = <Welcome onStart={()=>setStep('path')} />;
  }

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="brandmark"><span className="dot"/>Grow This Brand<small>Marketing Strategy Trainer</small></div>
        {step !== 'welcome' && step !== 'path' && <Stepper stepIndex={stageIndex} />}
      </div>
      <div className="shell">
        {body}
      </div>
      <footer className="appfooter">Built to teach strategic thinking — every choice here shapes the report at the end.</footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
