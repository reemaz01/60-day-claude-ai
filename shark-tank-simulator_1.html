<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shark Tank Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #080C14;
    --surface: #0E1520;
    --surface2: #141D2E;
    --surface3: #1A2540;
    --blue: #1BAAFF;
    --blue-dim: rgba(27,170,255,0.12);
    --gold: #F5C518;
    --gold-dim: rgba(245,197,24,0.12);
    --teal: #00E5CC;
    --teal-dim: rgba(0,229,204,0.1);
    --red: #FF3B5C;
    --red-dim: rgba(255,59,92,0.12);
    --purple: #9B6DFF;
    --text: #E8EDF5;
    --text-dim: #6B7A9A;
    --border: rgba(255,255,255,0.07);
    --glow-blue: 0 0 40px rgba(27,170,255,0.25);
    --glow-gold: 0 0 40px rgba(245,197,24,0.25);
    --glow-teal: 0 0 40px rgba(0,229,204,0.25);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── TANK AMBIENT ─── */
  .tank-ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(27,170,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 10% 100%, rgba(0,229,204,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 90% 80%, rgba(27,170,255,0.04) 0%, transparent 60%);
    animation: ambientPulse 8s ease-in-out infinite alternate;
  }
  @keyframes ambientPulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }

  /* Bubble particles */
  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(27,170,255,0.06);
    border: 1px solid rgba(27,170,255,0.1);
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.3; }
    to { transform: translateY(-20px) scale(1); opacity: 0; }
  }

  /* ─── SCREENS ─── */
  .screen {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: none; flex-direction: column; align-items: center;
    padding: 40px 20px;
  }
  .screen.active { display: flex; }

  /* ─── HEADER ─── */
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 8vw, 72px);
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--teal) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; line-height: 1;
  }
  .logo-sub {
    font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
    color: var(--text-dim); text-align: center; margin-top: 6px;
    font-weight: 500;
  }
  .logo-wrap { margin-bottom: 48px; }
  .logo-divider {
    width: 80px; height: 2px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
  }

  /* ─── CARDS ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    width: 100%; max-width: 760px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px;
    color: var(--blue); margin-bottom: 24px;
  }

  /* ─── FORM ─── */
  .form-grid { display: grid; gap: 18px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px; padding: 14px 16px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(27,170,255,0.1);
  }
  .form-group textarea { min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media(max-width:540px) { .form-row { grid-template-columns: 1fr; } }

  /* ─── BUTTONS ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 32px; border-radius: 50px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    border: none; cursor: pointer; transition: all 0.2s;
    text-decoration: none; position: relative; overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }
  .btn:hover::after { background: rgba(255,255,255,0.07); }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue) 0%, #0D7FCC 100%);
    color: #fff;
    box-shadow: 0 4px 24px rgba(27,170,255,0.35);
  }
  .btn-primary:hover { box-shadow: 0 4px 32px rgba(27,170,255,0.5); }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold) 0%, #D4A800 100%);
    color: #000;
    box-shadow: 0 4px 24px rgba(245,197,24,0.35);
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 14px; padding: 10px 22px;
    font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0;
  }
  .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
  .btn-sm { padding: 9px 20px; font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0; }

  /* ─── JUDGES PANEL ─── */
  .judges-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px; width: 100%; max-width: 900px;
    margin-bottom: 32px;
  }
  @media(max-width:700px) { .judges-grid { grid-template-columns: repeat(2,1fr); } }

  .judge-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px; text-align: center;
    transition: all 0.3s; position: relative; overflow: hidden;
    cursor: default;
  }
  .judge-card.speaking {
    border-color: var(--blue);
    box-shadow: var(--glow-blue);
    transform: translateY(-4px);
  }
  .judge-card.speaking .judge-glow {
    opacity: 1;
  }
  .judge-glow {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .judge-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    border: 2px solid var(--border);
    transition: border-color 0.3s;
  }
  .judge-card.speaking .judge-avatar {
    border-color: var(--blue);
    box-shadow: 0 0 16px rgba(27,170,255,0.3);
  }
  .judge-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing: 1.5px;
    color: var(--text); margin-bottom: 4px;
  }
  .judge-role {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .judge-status {
    font-size: 11px; color: var(--blue);
    margin-top: 8px; min-height: 14px; font-weight: 500;
  }

  /* ─── PITCH DISPLAY ─── */
  .pitch-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px; width: 100%; max-width: 900px;
    margin-bottom: 24px;
  }
  .pitch-startup-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px; letter-spacing: 3px;
    background: linear-gradient(135deg, var(--gold), #E8A000);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .pitch-ask {
    font-size: 13px; color: var(--teal); font-weight: 600;
    letter-spacing: 1px; margin-bottom: 20px;
  }
  .pitch-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media(max-width:540px) { .pitch-grid { grid-template-columns: 1fr; } }
  .pitch-field label {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 5px;
  }
  .pitch-field p { font-size: 14px; line-height: 1.6; color: var(--text); }

  /* ─── Q&A AREA ─── */
  .qa-container { width: 100%; max-width: 900px; }
  .qa-message {
    display: flex; gap: 14px; margin-bottom: 20px;
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .qa-message.user-msg { flex-direction: row-reverse; }
  .qa-avatar-sm {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .qa-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px;
    max-width: 75%; font-size: 14px; line-height: 1.6;
  }
  .qa-message.user-msg .qa-bubble {
    background: var(--blue-dim);
    border-color: rgba(27,170,255,0.2);
  }
  .qa-sender {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600; margin-bottom: 6px;
  }
  .qa-input-row {
    display: flex; gap: 12px; margin-top: 12px;
  }
  .qa-input {
    flex: 1; background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px; padding: 12px 20px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .qa-input:focus { border-color: var(--blue); }
  .qa-send {
    background: var(--blue); border: none; border-radius: 50%;
    width: 46px; height: 46px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px; transition: all 0.2s;
  }
  .qa-send:hover { background: #0D9EEF; transform: scale(1.05); }

  .progress-bar {
    width: 100%; max-width: 900px; margin-bottom: 20px;
  }
  .progress-track {
    background: var(--surface2); border-radius: 4px; height: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--teal));
    border-radius: 4px; transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 8px; font-weight: 600;
  }

  /* ─── SCORES ─── */
  .scores-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    width: 100%; max-width: 700px; margin-bottom: 32px;
  }
  @media(max-width:480px) { .scores-grid { grid-template-columns: 1fr; } }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px;
    animation: scoreIn 0.5s ease both;
  }
  @keyframes scoreIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .score-label {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600; margin-bottom: 12px;
  }
  .score-bar-row { display: flex; align-items: center; gap: 14px; }
  .score-number {
    font-family: 'Bebas Neue', sans-serif; font-size: 36px; line-height: 1;
    min-width: 56px;
  }
  .score-track {
    flex: 1; background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden;
  }
  .score-bar {
    height: 100%; border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    width: 0%;
  }

  .total-score-ring {
    position: relative; width: 160px; height: 160px; margin: 0 auto 24px;
  }
  .total-score-ring svg { transform: rotate(-90deg); }
  .score-ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring-num {
    font-family: 'Bebas Neue', sans-serif; font-size: 52px; line-height: 1;
  }
  .score-ring-label {
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ─── DECISION CARD ─── */
  .decision-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px; text-align: center;
    width: 100%; max-width: 600px;
    position: relative; overflow: hidden;
    animation: decisionReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  }
  @keyframes decisionReveal {
    from { opacity: 0; transform: scale(0.8) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .decision-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px; letter-spacing: 4px;
    display: block; margin-bottom: 8px;
  }
  .decision-icon { font-size: 64px; margin-bottom: 16px; display: block; }
  .decision-valuation {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .decision-val-num {
    font-family: 'Bebas Neue', sans-serif; font-size: 40px;
    margin-bottom: 24px;
  }
  .decision-reasoning {
    font-size: 14px; line-height: 1.7; color: var(--text-dim);
    border-top: 1px solid var(--border); padding-top: 20px;
    text-align: left;
  }
  .decision-card.invest {
    border: 1px solid rgba(0,229,204,0.3);
    box-shadow: 0 0 60px rgba(0,229,204,0.15);
  }
  .decision-card.invest .decision-badge { color: var(--teal); }
  .decision-card.invest .decision-val-num { color: var(--teal); }

  .decision-card.reject {
    border: 1px solid rgba(255,59,92,0.3);
    box-shadow: 0 0 60px rgba(255,59,92,0.1);
  }
  .decision-card.reject .decision-badge { color: var(--red); }

  .decision-card.acquire {
    border: 1px solid rgba(155,109,255,0.3);
    box-shadow: 0 0 60px rgba(155,109,255,0.15);
  }
  .decision-card.acquire .decision-badge { color: var(--purple); }
  .decision-card.acquire .decision-val-num { color: var(--purple); }

  .decision-card.comeback {
    border: 1px solid rgba(245,197,24,0.3);
    box-shadow: 0 0 60px rgba(245,197,24,0.1);
  }
  .decision-card.comeback .decision-badge { color: var(--gold); }

  /* ─── JUDGE DECISION ROWS ─── */
  .judge-decisions { width: 100%; max-width: 600px; margin: 24px 0; }
  .judge-decision-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    animation: slideIn 0.4s ease both;
  }
  .jd-emoji { font-size: 22px; }
  .jd-name { font-weight: 600; font-size: 14px; flex: 1; }
  .jd-verdict {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 12px;
    border-radius: 20px;
  }
  .jd-verdict.invest { background: var(--teal-dim); color: var(--teal); }
  .jd-verdict.reject { background: var(--red-dim); color: var(--red); }
  .jd-verdict.maybe { background: var(--gold-dim); color: var(--gold); }

  /* ─── ACTION BUTTONS ─── */
  .action-row {
    display: flex; flex-wrap: wrap; gap: 12px;
    justify-content: center; margin-top: 28px;
  }

  /* ─── LOADING ─── */
  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(8,12,20,0.85); backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
  }
  .loading-overlay.active { display: flex; }
  .loading-spinner {
    width: 60px; height: 60px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px;
    color: var(--blue);
  }
  .loading-sub { font-size: 13px; color: var(--text-dim); }

  /* ─── LEADERBOARD ─── */
  .lb-screen { max-width: 700px; margin: 0 auto; width: 100%; }
  .lb-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .lb-table {
    width: 100%; border-collapse: collapse;
  }
  .lb-table th {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); padding: 12px 16px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .lb-table td {
    padding: 14px 16px; font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  .lb-table tr:hover td { background: rgba(255,255,255,0.02); }
  .lb-rank { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
  .lb-score { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); }
  .lb-verdict { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 3px 10px; border-radius: 20px; }
  .lb-empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }

  /* ─── SHARE ─── */
  .share-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 32px;
    text-align: center; width: 100%; max-width: 500px;
    margin: 24px auto;
  }
  .share-score {
    font-family: 'Bebas Neue', sans-serif; font-size: 72px;
    background: linear-gradient(135deg, var(--gold), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* ─── NAV TABS ─── */
  .nav-tabs {
    display: flex; gap: 4px; margin-bottom: 32px;
    background: var(--surface); border-radius: 50px;
    padding: 4px; width: fit-content; align-self: center;
    border: 1px solid var(--border);
  }
  .nav-tab {
    padding: 9px 20px; border-radius: 50px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; color: var(--text-dim);
    border: none; background: transparent;
  }
  .nav-tab.active { background: var(--blue); color: #fff; }

  /* ─── CONFETTI ─── */
  .confetti-piece {
    position: fixed; top: -10px; pointer-events: none;
    z-index: 200; border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50px; padding: 12px 24px;
    font-size: 14px; font-weight: 600; z-index: 300;
    opacity: 0; transition: opacity 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ─── UTILS ─── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 3px; text-align: center;
    margin-bottom: 8px;
  }
  .section-sub {
    font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 32px;
  }
  .tag {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .gap-8 { gap: 8px; }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mt-32 { margin-top: 32px; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }
  .text-dim { color: var(--text-dim); }
  .text-blue { color: var(--blue); }
  .text-gold { color: var(--gold); }
  .text-teal { color: var(--teal); }
  .text-red { color: var(--red); }
  .hidden { display: none !important; }
  .scroll-area { overflow-y: auto; max-height: 420px; padding-right: 4px; }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
</style>
</head>
<body>

<!-- Ambient -->
<div class="tank-ambient"></div>
<div class="bubbles" id="bubbles"></div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">SHARKS ARE THINKING</div>
  <div class="loading-sub" id="loadingSubText">Analyzing your pitch...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════
     SCREEN 1: INPUT
════════════════════════════════════════ -->
<div class="screen active" id="screenInput">
  <div class="logo-wrap">
    <div class="logo">🦈 SHARK TANK AI</div>
    <div class="logo-sub">Powered by Claude · Pitch your startup to AI judges</div>
    <div class="logo-divider"></div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">📋 YOUR PITCH</div>
    <div class="form-grid">
      <div class="form-row">
        <div class="form-group">
          <label>Startup Name *</label>
          <input type="text" id="startupName" placeholder="e.g. AquaNet" />
        </div>
        <div class="form-group">
          <label>Funding Ask *</label>
          <input type="text" id="fundingAsk" placeholder="e.g. $500,000 for 10%" />
        </div>
      </div>
      <div class="form-group">
        <label>Problem Statement *</label>
        <textarea id="problemStatement" placeholder="What problem does your startup solve?"></textarea>
      </div>
      <div class="form-group">
        <label>Your Solution *</label>
        <textarea id="solution" placeholder="How do you solve it uniquely?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Revenue Model *</label>
          <input type="text" id="revenueModel" placeholder="e.g. SaaS, Marketplace, Ads" />
        </div>
        <div class="form-group">
          <label>Target Audience *</label>
          <input type="text" id="targetAudience" placeholder="e.g. SMBs, Gen Z consumers" />
        </div>
      </div>
    </div>
    <div style="margin-top:28px; text-align:center;">
      <button class="btn btn-primary" onclick="startPitch()">
        🦈 ENTER THE TANK
      </button>
    </div>
  </div>

  <button class="btn btn-outline" onclick="showScreen('screenLeaderboard')">
    🏆 Leaderboard
  </button>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 2: PITCH ROUND
════════════════════════════════════════ -->
<div class="screen" id="screenPitch">
  <div class="logo-wrap" style="margin-bottom:28px;">
    <div class="logo" style="font-size:clamp(28px,5vw,48px);">THE TANK</div>
    <div class="logo-sub">PITCH ROUND · FACE THE SHARKS</div>
    <div class="logo-divider"></div>
  </div>

  <div class="judges-grid" id="judgesPanel"></div>

  <div class="pitch-box" id="pitchBox"></div>

  <div class="progress-bar" id="qaProgress">
    <div class="progress-label" id="qaProgressLabel">Questions Remaining</div>
    <div class="progress-track"><div class="progress-fill" id="qaFill" style="width:0%"></div></div>
  </div>

  <div class="qa-container">
    <div class="scroll-area" id="qaMessages" style="margin-bottom:16px;"></div>
    <div class="qa-input-row" id="qaInputRow">
      <input class="qa-input" id="qaInput" placeholder="Answer the shark's question…" onkeydown="if(event.key==='Enter')sendAnswer()" />
      <button class="qa-send" onclick="sendAnswer()">➤</button>
    </div>
    <div id="qaNextBtn" class="hidden" style="text-align:center;margin-top:16px;">
      <button class="btn btn-primary" onclick="proceedToScoring()">
        📊 SEE SCORES & DECISION →
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 3: SCORES + DECISION
════════════════════════════════════════ -->
<div class="screen" id="screenScores">
  <div class="logo-wrap" style="margin-bottom:28px;">
    <div class="logo" style="font-size:clamp(28px,5vw,48px);">THE VERDICT</div>
    <div class="logo-sub">SCORING & INVESTMENT DECISION</div>
    <div class="logo-divider"></div>
  </div>

  <div class="total-score-ring">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="10"/>
      <circle id="ringCircle" cx="80" cy="80" r="68" fill="none"
        stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="427" stroke-dashoffset="427"
        style="transition: stroke-dashoffset 1.5s cubic-bezier(0.23,1,0.32,1);"/>
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1BAAFF"/>
          <stop offset="100%" stop-color="#00E5CC"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="score-ring-text">
      <div class="score-ring-num text-blue" id="totalScoreNum">0</div>
      <div class="score-ring-label">/ 100</div>
    </div>
  </div>

  <div class="scores-grid" id="scoresGrid"></div>

  <div class="section-title mt-32">JUDGE DECISIONS</div>
  <div class="judge-decisions" id="judgeDecisions"></div>

  <div id="decisionArea" style="width:100%;max-width:600px;margin-top:24px;"></div>

  <div class="action-row" id="resultActions"></div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 4: LEADERBOARD
════════════════════════════════════════ -->
<div class="screen" id="screenLeaderboard">
  <div class="logo-wrap" style="margin-bottom:16px;">
    <div class="logo" style="font-size:clamp(28px,5vw,48px);">🏆 LEADERBOARD</div>
    <div class="logo-sub">TOP PITCHES OF ALL TIME</div>
    <div class="logo-divider"></div>
  </div>
  <div class="lb-screen">
    <div class="lb-header">
      <div class="text-dim" id="lbCount"></div>
      <button class="btn btn-outline" onclick="showScreen('screenInput')">← NEW PITCH</button>
    </div>
    <div id="lbContent"></div>
  </div>
</div>

<script>
// ══════════════════════════════
// STATE
// ══════════════════════════════
const STATE = {
  pitch: {},
  qaHistory: [], // {role, judge, text}
  currentQIdx: 0,
  allQuestions: [], // [{judgeKey, question}]
  awaitingAnswer: false,
  scores: {},
  totalScore: 0,
  decision: {},
  judgePersonalities: {},
};

const JUDGES = [
  {
    key: 'vc', name: 'Victor Chen', role: 'Venture Capitalist', emoji: '💼',
    focus: 'market size and scalability',
    color: '#1BAAFF',
    personality: 'Analytical, data-driven, obsessed with TAM/SAM/SOM. Uses terms like "hockey stick growth," "defensible moat," "unit economics." Asks about exit strategy and Series A readiness.',
  },
  {
    key: 'founder', name: 'Maya Patel', role: 'Serial Founder', emoji: '🚀',
    focus: 'execution and team',
    color: '#00E5CC',
    personality: 'Blunt, no-nonsense. Has been in the trenches. Asks about founding team, technical debt, go-to-market motion, and what\'s been shipped vs. imagined.',
  },
  {
    key: 'customer', name: 'Alex Kim', role: 'Customer Voice', emoji: '🎯',
    focus: 'usefulness and user experience',
    color: '#F5C518',
    personality: 'Empathetic, user-first. Asks "but would people actually use this?" Probes pain point depth, substitutes, and customer retention.',
  },
  {
    key: 'angel', name: 'Dana Ross', role: 'Angel Investor', emoji: '😇',
    focus: 'profitability and ROI',
    color: '#9B6DFF',
    personality: 'Cautious but visionary. Asks about margins, burn rate, path to profitability, and defensibility. Has seen 500 pitches and can smell BS instantly.',
  },
];

// ══════════════════════════════
// BUBBLES
// ══════════════════════════════
(function createBubbles() {
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 24 + 6;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*20+15}s;
      animation-delay:${Math.random()*-25}s;
    `;
    container.appendChild(b);
  }
})();

// ══════════════════════════════
// SCREEN MANAGEMENT
// ══════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'screenLeaderboard') renderLeaderboard();
}

// ══════════════════════════════
// LOADING
// ══════════════════════════════
function showLoading(text = 'SHARKS ARE THINKING', sub = 'Analyzing your pitch...') {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingSubText').textContent = sub;
  document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// ══════════════════════════════
// TOAST
// ══════════════════════════════
function toast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ══════════════════════════════
// CLAUDE API
// ══════════════════════════════
async function callClaude(systemPrompt, userMessage) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!response.ok) throw new Error('API error ' + response.status);
  const data = await response.json();
  return data.content.map(b => b.text || '').join('');
}

// ══════════════════════════════
// PITCH START
// ══════════════════════════════
async function startPitch() {
  const fields = {
    name: document.getElementById('startupName').value.trim(),
    problem: document.getElementById('problemStatement').value.trim(),
    solution: document.getElementById('solution').value.trim(),
    revenue: document.getElementById('revenueModel').value.trim(),
    audience: document.getElementById('targetAudience').value.trim(),
    ask: document.getElementById('fundingAsk').value.trim(),
  };

  if (!fields.name || !fields.problem || !fields.solution || !fields.revenue || !fields.audience || !fields.ask) {
    toast('⚠️ Please fill in all fields!'); return;
  }

  STATE.pitch = fields;
  STATE.qaHistory = [];
  STATE.allQuestions = [];
  STATE.currentQIdx = 0;

  showLoading('ENTERING THE TANK', 'Sharks are reading your pitch...');

  try {
    await generateAllQuestions();
    showScreen('screenPitch');
    buildPitchUI();
    hideLoading();
    await startQA();
  } catch (e) {
    hideLoading();
    toast('❌ Error: ' + e.message);
    console.error(e);
  }
}

function getPitchSummary() {
  const p = STATE.pitch;
  return `Startup: ${p.name}
Problem: ${p.problem}
Solution: ${p.solution}
Revenue Model: ${p.revenue}
Target Audience: ${p.audience}
Funding Ask: ${p.ask}`;
}

async function generateAllQuestions() {
  const pitch = getPitchSummary();
  const sys = `You are running an AI Shark Tank show. Generate exactly 8 questions (2 per judge) for this startup pitch. 
Return ONLY a JSON array with objects: [{judgeKey, question}]
Judge keys: vc, founder, customer, angel
Judge personalities:
- vc (Victor Chen, VC): ${JUDGES[0].personality}
- founder (Maya Patel, Founder): ${JUDGES[1].personality}  
- customer (Alex Kim, Customer): ${JUDGES[2].personality}
- angel (Dana Ross, Angel): ${JUDGES[3].personality}
Make questions sharp, specific, and in-character. No preamble, return valid JSON only.`;

  const raw = await callClaude(sys, `Pitch:\n${pitch}`);
  const clean = raw.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  STATE.allQuestions = parsed;
}

// ══════════════════════════════
// BUILD PITCH UI
// ══════════════════════════════
function buildPitchUI() {
  // Judges panel
  const panel = document.getElementById('judgesPanel');
  panel.innerHTML = JUDGES.map(j => `
    <div class="judge-card" id="judge_${j.key}">
      <div class="judge-glow"></div>
      <div class="judge-avatar" style="background:${j.color}18; border-color:${j.color}30; font-size:28px;">${j.emoji}</div>
      <div class="judge-name">${j.name}</div>
      <div class="judge-role">${j.role}</div>
      <div class="judge-status" id="judgeStatus_${j.key}"></div>
    </div>
  `).join('');

  // Pitch box
  const p = STATE.pitch;
  document.getElementById('pitchBox').innerHTML = `
    <div class="pitch-startup-name">${escHtml(p.name)}</div>
    <div class="pitch-ask">Seeking ${escHtml(p.ask)}</div>
    <div class="pitch-grid">
      <div class="pitch-field"><label>Problem</label><p>${escHtml(p.problem)}</p></div>
      <div class="pitch-field"><label>Solution</label><p>${escHtml(p.solution)}</p></div>
      <div class="pitch-field"><label>Revenue Model</label><p>${escHtml(p.revenue)}</p></div>
      <div class="pitch-field"><label>Target Audience</label><p>${escHtml(p.audience)}</p></div>
    </div>
  `;

  document.getElementById('qaMessages').innerHTML = '';
  document.getElementById('qaNextBtn').classList.add('hidden');
  document.getElementById('qaInputRow').classList.remove('hidden');
  updateProgress();
}

// ══════════════════════════════
// Q&A FLOW
// ══════════════════════════════
async function startQA() {
  if (STATE.currentQIdx < STATE.allQuestions.length) {
    await askNextQuestion();
  }
}

async function askNextQuestion() {
  if (STATE.currentQIdx >= STATE.allQuestions.length) {
    finishQA(); return;
  }

  const q = STATE.allQuestions[STATE.currentQIdx];
  const judge = JUDGES.find(j => j.key === q.judgeKey);

  // Highlight judge
  setJudgeSpeaking(q.judgeKey);
  setJudgeStatus(q.judgeKey, 'Asking question...');

  addMessage(judge.emoji, judge.name, q.question, 'judge');
  STATE.qaHistory.push({ role: 'judge', judgeKey: q.judgeKey, judgeName: judge.name, text: q.question });

  STATE.awaitingAnswer = true;
  document.getElementById('qaInput').focus();
  updateProgress();
}

async function sendAnswer() {
  if (!STATE.awaitingAnswer) return;
  const input = document.getElementById('qaInput');
  const answer = input.value.trim();
  if (!answer) { toast('Please type an answer!'); return; }

  input.value = '';
  STATE.awaitingAnswer = false;

  addMessage('👤', 'You', answer, 'user');
  STATE.qaHistory.push({ role: 'user', text: answer });

  const q = STATE.allQuestions[STATE.currentQIdx];
  const judge = JUDGES.find(j => j.key === q.judgeKey);

  setJudgeStatus(q.judgeKey, 'Reacting...');

  // Get judge reaction
  try {
    const reaction = await getJudgeReaction(judge, q.question, answer);
    addMessage(judge.emoji, judge.name, reaction, 'judge');
    STATE.qaHistory.push({ role: 'judge', judgeKey: q.judgeKey, judgeName: judge.name, text: reaction });
    setJudgeStatus(q.judgeKey, '✓ Got your answer');
  } catch(e) {
    console.error(e);
  }

  STATE.currentQIdx++;
  updateProgress();
  setJudgeSpeaking(null);

  if (STATE.currentQIdx < STATE.allQuestions.length) {
    setTimeout(() => askNextQuestion(), 1200);
  } else {
    finishQA();
  }
}

async function getJudgeReaction(judge, question, answer) {
  const sys = `You are ${judge.name}, a ${judge.role} in Shark Tank. Your focus: ${judge.focus}. ${judge.personality}
Give a SHORT 1-2 sentence reaction to the founder's answer. Be in-character: sometimes skeptical, sometimes impressed, always sharp. No fluff.`;
  const msg = `Your question was: "${question}"\nFounder answered: "${answer}"\nGive your reaction:`;
  return await callClaude(sys, msg);
}

function finishQA() {
  STATE.awaitingAnswer = false;
  document.getElementById('qaInputRow').classList.add('hidden');
  document.getElementById('qaNextBtn').classList.remove('hidden');
  setJudgeSpeaking(null);
  JUDGES.forEach(j => setJudgeStatus(j.key, '📊 Ready to vote'));
  updateProgress();
}

function updateProgress() {
  const total = STATE.allQuestions.length;
  const done = Math.min(STATE.currentQIdx, total);
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('qaFill').style.width = pct + '%';
  document.getElementById('qaProgressLabel').textContent =
    done < total ? `Question ${done + 1} of ${total}` : `All ${total} questions answered`;
}

function setJudgeSpeaking(key) {
  JUDGES.forEach(j => {
    const card = document.getElementById('judge_' + j.key);
    if (card) card.classList.toggle('speaking', j.key === key);
  });
}
function setJudgeStatus(key, text) {
  const el = document.getElementById('judgeStatus_' + key);
  if (el) el.textContent = text;
}

function addMessage(emoji, name, text, type) {
  const container = document.getElementById('qaMessages');
  const div = document.createElement('div');
  div.className = `qa-message ${type === 'user' ? 'user-msg' : ''}`;
  div.innerHTML = `
    <div class="qa-avatar-sm">${emoji}</div>
    <div class="qa-bubble">
      <div class="qa-sender">${name}</div>
      <div>${escHtml(text)}</div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ══════════════════════════════
// SCORING & DECISION
// ══════════════════════════════
async function proceedToScoring() {
  showLoading('DELIBERATING', 'Sharks are calculating scores...');
  showScreen('screenScores');

  try {
    const result = await generateScoresAndDecision();
    hideLoading();
    renderScores(result);
  } catch(e) {
    hideLoading();
    toast('❌ Error generating scores: ' + e.message);
    console.error(e);
  }
}

async function generateScoresAndDecision() {
  const sys = `You are the head judge of an AI Shark Tank show. Evaluate the startup pitch and Q&A session.
Return ONLY valid JSON with this exact structure:
{
  "scores": {
    "marketPotential": <0-100>,
    "innovation": <0-100>,
    "businessModel": <0-100>,
    "execution": <0-100>,
    "investmentWorthiness": <0-100>
  },
  "judgeVerdicts": [
    {"judgeKey": "vc", "verdict": "invest|reject|maybe", "comment": "<one sentence>"},
    {"judgeKey": "founder", "verdict": "invest|reject|maybe", "comment": "<one sentence>"},
    {"judgeKey": "customer", "verdict": "invest|reject|maybe", "comment": "<one sentence>"},
    {"judgeKey": "angel", "verdict": "invest|reject|maybe", "comment": "<one sentence>"}
  ],
  "decision": "invest|reject|acquire|comeback",
  "valuation": "<e.g. $5M>",
  "fundingAmount": "<e.g. $500,000>",
  "reasoning": "<2-3 sentences explaining the decision>"
}
Base decision on aggregate scores. Be realistic and fair. No extra text.`;

  const qaSummary = STATE.qaHistory.map(m =>
    `${m.judgeName || 'Founder'}: ${m.text}`
  ).join('\n');

  const msg = `Pitch:\n${getPitchSummary()}\n\nQ&A Session:\n${qaSummary}`;
  const raw = await callClaude(sys, msg);
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function renderScores(result) {
  STATE.scores = result.scores;
  const scoreArr = Object.values(result.scores);
  STATE.totalScore = Math.round(scoreArr.reduce((a, b) => a + b, 0) / scoreArr.length);
  STATE.decision = result;

  // Animate ring
  const circumference = 427;
  const offset = circumference - (STATE.totalScore / 100) * circumference;
  setTimeout(() => {
    document.getElementById('ringCircle').style.strokeDashoffset = offset;
  }, 100);

  // Animate number
  animateNumber('totalScoreNum', 0, STATE.totalScore, 1500);

  // Color the ring based on score
  const color = STATE.totalScore >= 70 ? '#00E5CC' : STATE.totalScore >= 50 ? '#1BAAFF' : STATE.totalScore >= 30 ? '#F5C518' : '#FF3B5C';
  document.getElementById('ringCircle').setAttribute('stroke', color);
  document.getElementById('totalScoreNum').style.color = color;

  // Score cards
  const labels = {
    marketPotential: 'Market Potential',
    innovation: 'Innovation',
    businessModel: 'Business Model',
    execution: 'Execution',
    investmentWorthiness: 'Investment Worthiness',
  };
  const colors = ['#1BAAFF','#00E5CC','#F5C518','#9B6DFF','#FF3B5C'];
  const grid = document.getElementById('scoresGrid');
  grid.innerHTML = '';
  Object.entries(result.scores).forEach(([key, val], i) => {
    const card = document.createElement('div');
    card.className = 'score-card';
    card.style.animationDelay = (i * 0.1) + 's';
    const color = colors[i];
    card.innerHTML = `
      <div class="score-label">${labels[key]}</div>
      <div class="score-bar-row">
        <div class="score-number" style="color:${color}">${val}</div>
        <div class="score-track">
          <div class="score-bar" id="sbar_${key}" style="background:${color};"></div>
        </div>
      </div>
    `;
    grid.appendChild(card);
    setTimeout(() => {
      document.getElementById('sbar_' + key).style.width = val + '%';
    }, 300 + i * 120);
  });

  // Judge verdicts
  const judgeArea = document.getElementById('judgeDecisions');
  judgeArea.innerHTML = result.judgeVerdicts.map((jv, i) => {
    const judge = JUDGES.find(j => j.key === jv.judgeKey);
    return `
      <div class="judge-decision-row" style="animation-delay:${i*0.15}s">
        <div class="jd-emoji">${judge.emoji}</div>
        <div>
          <div class="jd-name">${judge.name}</div>
          <div class="text-dim" style="font-size:12px;">${escHtml(jv.comment)}</div>
        </div>
        <div class="jd-verdict ${jv.verdict}">${jv.verdict === 'invest' ? '✅ IN' : jv.verdict === 'reject' ? '❌ OUT' : '🤔 MAYBE'}</div>
      </div>
    `;
  }).join('');

  // Decision card
  renderDecision(result);

  // Save to leaderboard
  saveToLeaderboard({
    name: STATE.pitch.name,
    ask: STATE.pitch.ask,
    score: STATE.totalScore,
    decision: result.decision,
    valuation: result.valuation,
    date: new Date().toLocaleDateString(),
  });

  // Confetti if invest/acquire
  if (result.decision === 'invest' || result.decision === 'acquire') {
    setTimeout(launchConfetti, 800);
  }
}

function renderDecision(result) {
  const decisionConfig = {
    invest: { label: 'DEAL!', icon: '🤝', desc: 'The sharks are IN!', cls: 'invest' },
    reject: { label: 'OUT', icon: '🦈❌', desc: 'The sharks pass.', cls: 'reject' },
    acquire: { label: 'ACQUIRE', icon: '🏆', desc: 'They want to buy it!', cls: 'acquire' },
    comeback: { label: 'COME BACK', icon: '⏰', desc: 'Not ready yet.', cls: 'comeback' },
  };

  const cfg = decisionConfig[result.decision] || decisionConfig.reject;
  const area = document.getElementById('decisionArea');
  area.innerHTML = `
    <div class="decision-card ${cfg.cls}">
      <span class="decision-icon">${cfg.icon}</span>
      <span class="decision-badge">${cfg.label}</span>
      <div class="decision-valuation">Suggested Valuation</div>
      <div class="decision-val-num">${escHtml(result.valuation)}</div>
      <div class="decision-valuation">Funding Amount</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;margin-bottom:20px;color:var(--text)">${escHtml(result.fundingAmount)}</div>
      <div class="decision-reasoning">
        <strong>Reasoning:</strong> ${escHtml(result.reasoning)}
      </div>
    </div>
  `;

  // Action buttons
  document.getElementById('resultActions').innerHTML = `
    <button class="btn btn-primary" onclick="startPitch_reset()">🔄 NEW PITCH</button>
    <button class="btn btn-outline" onclick="downloadPDF()">⬇️ Download Report</button>
    <button class="btn btn-outline" onclick="shareResult()">🔗 Share Result</button>
    <button class="btn btn-outline" onclick="showScreen('screenLeaderboard')">🏆 Leaderboard</button>
  `;
}

// ══════════════════════════════
// LEADERBOARD
// ══════════════════════════════
function saveToLeaderboard(entry) {
  const lb = JSON.parse(localStorage.getItem('sharkTankLB') || '[]');
  lb.unshift(entry);
  lb.sort((a, b) => b.score - a.score);
  localStorage.setItem('sharkTankLB', JSON.stringify(lb.slice(0, 50)));
}

function renderLeaderboard() {
  const lb = JSON.parse(localStorage.getItem('sharkTankLB') || '[]');
  const content = document.getElementById('lbContent');
  document.getElementById('lbCount').textContent = lb.length + ' pitches logged';

  if (lb.length === 0) {
    content.innerHTML = `<div class="lb-empty">
      <div style="font-size:48px;margin-bottom:16px;">🦈</div>
      <div style="font-size:18px;font-weight:600;margin-bottom:8px;">No pitches yet</div>
      <div class="text-dim">Be the first to pitch!</div>
    </div>`;
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  const decisionColors = {
    invest: 'var(--teal)', reject: 'var(--red)', acquire: 'var(--purple)', comeback: 'var(--gold)'
  };

  content.innerHTML = `
    <table class="lb-table">
      <thead>
        <tr>
          <th>#</th><th>Startup</th><th>Score</th><th>Verdict</th><th>Valuation</th><th>Date</th>
        </tr>
      </thead>
      <tbody>
        ${lb.map((e, i) => `
          <tr>
            <td class="lb-rank" style="color:${i<3?'var(--gold)':'var(--text-dim)'}">${medals[i] || (i+1)}</td>
            <td>
              <div style="font-weight:600">${escHtml(e.name)}</div>
              <div class="text-dim" style="font-size:12px">${escHtml(e.ask)}</div>
            </td>
            <td class="lb-score">${e.score}</td>
            <td><span class="lb-verdict" style="background:${decisionColors[e.decision]}18;color:${decisionColors[e.decision]}">${e.decision.toUpperCase()}</span></td>
            <td style="color:var(--text-dim);font-size:13px">${escHtml(e.valuation || '—')}</td>
            <td style="color:var(--text-dim);font-size:12px">${e.date}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div style="text-align:center;margin-top:20px;">
      <button class="btn btn-outline" onclick="clearLeaderboard()" style="color:var(--red);border-color:var(--red-dim)">🗑 Clear Leaderboard</button>
    </div>
  `;
}

function clearLeaderboard() {
  if (confirm('Clear all leaderboard entries?')) {
    localStorage.removeItem('sharkTankLB');
    renderLeaderboard();
    toast('Leaderboard cleared');
  }
}

// ══════════════════════════════
// PDF REPORT
// ══════════════════════════════
async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const p = STATE.pitch;
  const d = STATE.decision;

  // Dark background
  doc.setFillColor(8, 12, 20);
  doc.rect(0, 0, 210, 297, 'F');

  // Header
  doc.setTextColor(27, 170, 255);
  doc.setFontSize(28);
  doc.setFont('helvetica', 'bold');
  doc.text('SHARK TANK AI', 105, 22, { align: 'center' });

  doc.setTextColor(107, 122, 154);
  doc.setFontSize(9);
  doc.text('PITCH EVALUATION REPORT', 105, 30, { align: 'center' });

  // Startup name
  doc.setTextColor(245, 197, 24);
  doc.setFontSize(20);
  doc.text(p.name.toUpperCase(), 105, 44, { align: 'center' });

  doc.setTextColor(0, 229, 204);
  doc.setFontSize(10);
  doc.text('Funding Ask: ' + p.ask, 105, 52, { align: 'center' });

  // Divider
  doc.setDrawColor(27, 170, 255);
  doc.setLineWidth(0.3);
  doc.line(20, 57, 190, 57);

  // Pitch details
  doc.setTextColor(107, 122, 154);
  doc.setFontSize(7);
  let y = 66;
  const fields = [
    ['PROBLEM', p.problem], ['SOLUTION', p.solution],
    ['REVENUE MODEL', p.revenue], ['TARGET AUDIENCE', p.audience],
  ];
  fields.forEach(([lbl, val]) => {
    doc.setTextColor(107, 122, 154);
    doc.setFontSize(7);
    doc.text(lbl, 20, y);
    doc.setTextColor(232, 237, 245);
    doc.setFontSize(9);
    const lines = doc.splitTextToSize(val, 165);
    doc.text(lines, 20, y + 5);
    y += 8 + (lines.length - 1) * 5;
  });

  y += 4;
  doc.setDrawColor(30, 30, 50);
  doc.line(20, y, 190, y);
  y += 8;

  // Scores
  doc.setTextColor(27, 170, 255);
  doc.setFontSize(11);
  doc.text('SCORES', 20, y);
  y += 7;

  const scoreLabels = {
    marketPotential: 'Market Potential', innovation: 'Innovation',
    businessModel: 'Business Model', execution: 'Execution',
    investmentWorthiness: 'Investment Worthiness',
  };
  Object.entries(d.scores || {}).forEach(([key, val]) => {
    doc.setTextColor(107, 122, 154);
    doc.setFontSize(8);
    doc.text(scoreLabels[key] || key, 20, y);
    doc.setTextColor(232, 237, 245);
    doc.text(String(val) + '/100', 190, y, { align: 'right' });
    // Mini bar
    doc.setFillColor(20, 29, 46);
    doc.rect(90, y - 4, 80, 3, 'F');
    doc.setFillColor(27, 170, 255);
    doc.rect(90, y - 4, 80 * (val / 100), 3, 'F');
    y += 9;
  });

  y += 2;
  doc.setTextColor(107, 122, 154);
  doc.setFontSize(8);
  doc.text('TOTAL SCORE', 20, y);
  doc.setTextColor(0, 229, 204);
  doc.setFontSize(16);
  doc.text(String(STATE.totalScore) + '/100', 190, y + 2, { align: 'right' });
  y += 12;

  doc.setDrawColor(30, 30, 50);
  doc.line(20, y, 190, y);
  y += 8;

  // Decision
  doc.setTextColor(27, 170, 255);
  doc.setFontSize(11);
  doc.text('DECISION', 20, y);
  y += 7;

  const decColors = { invest: [0,229,204], reject: [255,59,92], acquire: [155,109,255], comeback: [245,197,24] };
  const dc = decColors[d.decision] || [255,255,255];
  doc.setTextColor(...dc);
  doc.setFontSize(18);
  doc.text((d.decision || 'N/A').toUpperCase(), 20, y + 4);

  doc.setTextColor(107, 122, 154);
  doc.setFontSize(8);
  doc.text('VALUATION', 120, y);
  doc.setTextColor(232, 237, 245);
  doc.setFontSize(12);
  doc.text(d.valuation || '—', 120, y + 6);

  doc.setTextColor(107, 122, 154);
  doc.setFontSize(8);
  doc.text('FUNDING', 162, y);
  doc.setTextColor(232, 237, 245);
  doc.setFontSize(12);
  doc.text(d.fundingAmount || '—', 162, y + 6);
  y += 18;

  doc.setTextColor(232, 237, 245);
  doc.setFontSize(9);
  const reasonLines = doc.splitTextToSize(d.reasoning || '', 165);
  doc.text(reasonLines, 20, y);
  y += reasonLines.length * 5 + 8;

  // Footer
  doc.setTextColor(50, 60, 80);
  doc.setFontSize(7);
  doc.text('Generated by AI Shark Tank Simulator · ' + new Date().toLocaleString(), 105, 290, { align: 'center' });

  doc.save(`${p.name.replace(/\s+/g,'_')}_SharkTank_Report.pdf`);
  toast('📄 PDF downloaded!');
}

// ══════════════════════════════
// SHARE
// ══════════════════════════════
function shareResult() {
  const d = STATE.decision;
  const text = `🦈 I just pitched "${STATE.pitch.name}" on AI Shark Tank!\n` +
    `Score: ${STATE.totalScore}/100 | Decision: ${(d.decision || '').toUpperCase()}\n` +
    `Valuation: ${d.valuation || 'N/A'}\n\n` +
    `Try it yourself → ${window.location.href}`;

  if (navigator.share) {
    navigator.share({ title: 'AI Shark Tank Result', text }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  navigator.clipboard.writeText(text).then(() => toast('📋 Result copied to clipboard!'))
    .catch(() => toast('Share text ready — copy from console'));
}

// ══════════════════════════════
// CONFETTI
// ══════════════════════════════
function launchConfetti() {
  const colors = ['#1BAAFF','#00E5CC','#F5C518','#9B6DFF','#FF3B5C','#fff'];
  for (let i = 0; i < 120; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const size = Math.random() * 10 + 5;
      el.style.cssText = `
        width:${size}px; height:${size * (Math.random() < 0.5 ? 1 : 2.5)}px;
        left:${Math.random() * 100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${Math.random()*2+2}s;
        animation-delay:${Math.random()*0.5}s;
        border-radius:${Math.random()<0.3?'50%':'2px'};
        opacity:${Math.random()*0.4+0.6};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 20);
  }
}

// ══════════════════════════════
// HELPERS
// ══════════════════════════════
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function animateNumber(id, from, to, duration) {
  const el = document.getElementById(id);
  const start = Date.now();
  const tick = () => {
    const elapsed = Date.now() - start;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(from + (to - from) * ease);
    if (progress < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function startPitch_reset() {
  STATE.pitch = {};
  STATE.qaHistory = [];
  STATE.allQuestions = [];
  STATE.currentQIdx = 0;
  STATE.awaitingAnswer = false;
  showScreen('screenInput');
}
